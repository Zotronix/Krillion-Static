/* Synthesised cues, built only after the first gesture.
   Frequencies and envelopes mirror krillion.game's event sounds. */

class Sound {
  constructor(enabled = true) {
    this.enabled = enabled;
    this.ctx = null;
    this.master = null;
  }

  ensure() {
    if (!this.enabled) return null;
    try {
      if (!this.ctx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        this.ctx = new Ctx();
        this.master = this.ctx.createGain();
        this.master.gain.value = 1;
        this.master.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    } catch {
      return null;
    }
  }

  setEnabled(on) {
    this.enabled = on;
    if (!on && this.ctx) this.ctx.suspend().catch(() => {});
    if (on) this.ensure();
  }

  suspend() {
    if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => {});
  }

  tone(freq = 440, dur = 0.16, { delay = 0, type = 'sine', vol = 0.06, end = freq } = {}) {
    if (!this.enabled) return;
    const ctx = this.ensure();
    if (!ctx) return;
    const t = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, end), t + dur);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(this.master);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  noise(dur = 0.3, { delay = 0, vol = 0.05, from = 2000, to = 240, type = 'lowpass' } = {}) {
    if (!this.enabled) return;
    const ctx = this.ensure();
    if (!ctx) return;
    const t = ctx.currentTime + delay;
    const frames = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buffer = ctx.createBuffer(1, frames, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < frames; i++) data[i] = (Math.random() * 2 - 1) * 0.6;
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = type;
    filter.frequency.setValueAtTime(from, t);
    filter.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(filter).connect(gain).connect(this.master);
    src.start(t);
  }

  start() {
    this.tone(110, 1.2, { end: 48, type: 'sine', vol: 0.07 });
    this.tone(784, 0.22, { delay: 0.12, type: 'triangle', vol: 0.035 });
    this.tone(523, 0.26, { delay: 0.26, type: 'triangle', vol: 0.03 });
    this.noise(1.1, { vol: 0.05, from: 2000, to: 240 });
  }

  submit() {
    this.tone(1150, 0.16, { type: 'sine', vol: 0.055 });
  }

  /* Answer accepted: a short two-note lift, brighter with the tier. */
  correct(tier) {
    const base = tier === 'krillion' ? 1046 : tier === 'deepcut' ? 880 : tier === 'rare' ? 784 : 659;
    this.tone(base, 0.12, { type: 'triangle', vol: 0.035 });
    this.tone(base * 1.5, 0.16, { delay: 0.06, type: 'triangle', vol: 0.028 });
  }

  /* Water rushing past as the camera follows the answer down. */
  whoosh(duration = 1.2) {
    this.noise(duration, { vol: 0.055, from: 180, to: 1500, type: 'bandpass' });
    this.tone(70, duration, { end: 34, type: 'sine', vol: 0.05 });
  }

  reject() {
    this.tone(150, 0.36, { end: 62, type: 'sine', vol: 0.06 });
    this.noise(0.22, { vol: 0.035, from: 420, to: 180 });
  }

  /* Ladder tick: one tiny blip each time the chip passes a tier line. */
  tier() {
    this.tone(1480, 0.05, { type: 'square', vol: 0.018 });
  }

  tick() {
    this.tone(880, 0.05, { type: 'square', vol: 0.025 });
    this.tone(880, 0.05, { delay: 0.12, type: 'square', vol: 0.025 });
  }

  land(tier) {
    if (!tier) return this.tone(140, 0.4, { end: 70, type: 'sine', vol: 0.06 });
    if (tier === 'plankton' || tier === 'tooclever') {
      this.tone(140, 0.25, { end: 70, type: 'sine', vol: 0.06 });
      this.noise(0.18, { vol: 0.03, from: 300, to: 120 });
      return;
    }
    if (tier === 'krillion') {
      this.tone(60, 1.1, { end: 40, type: 'sine', vol: 0.08 });
      [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.3, { delay: i * 0.13, type: 'triangle', vol: 0.04 }));
      this.noise(0.7, { vol: 0.025, from: 5200, to: 1200, type: 'highpass' });
      return;
    }
    this.tone(80, 0.7, { end: 45, type: 'sine', vol: 0.07 });
    this.noise(0.7, { vol: 0.035, from: 900, to: 120 });
    this.tone(523, 0.35, { delay: 0.15, type: 'triangle', vol: 0.03 });
  }

  timeout() {
    this.tone(220, 0.7, { end: 52, type: 'sine', vol: 0.06 });
    this.noise(0.5, { delay: 0.05, vol: 0.03, from: 600, to: 90 });
  }

  surface() {
    this.tone(80, 1.5, { end: 600, type: 'sine', vol: 0.05 });
    this.noise(1.5, { vol: 0.03, from: 300, to: 3000, type: 'lowpass' });
  }

  poke() {
    const detune = 0.94 + Math.random() * 0.12;
    this.tone(260 * detune, 0.18, { end: 720, type: 'triangle', vol: 0.045 });
    this.noise(0.08, { vol: 0.02, from: 2400, to: 900, type: 'bandpass' });
  }

  gold() {
    this.tone(1568, 0.5, { type: 'triangle', vol: 0.035 });
    this.tone(2093, 0.4, { delay: 0.12, type: 'triangle', vol: 0.025 });
  }
}

/* ---- src/scene-layers.mjs ---- */
/* Small pixel-art drawing routines. Everything is integer-snapped so the
   upscaled 1/3-scale canvas stays crisp. */

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

function mix(a, b, t) {
  const parse = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const [r1, g1, b1] = parse(a);
  const [r2, g2, b2] = parse(b);
  const r = Math.round(r1 + (r2 - r1) * t);
  const g = Math.round(g1 + (g2 - g1) * t);
  const bl = Math.round(b1 + (b2 - b1) * t);
  return `rgb(${r},${g},${bl})`;
}

const BANDS_LOOK = [
  { depth: 450, label: 'the light is starting to lose your trail' },
  { depth: 1000, label: 'TWILIGHT ZONE' },
  { depth: 1650, label: 'a current that knows how to wait' },
  { depth: 2400, label: 'last postcard received' },
  { depth: 3000, label: 'MIDNIGHT WATERS' },
  { depth: 3800, label: 'something just answered' },
  { depth: 4700, label: 'pressure makes its own weather' },
  { depth: 5500, label: 'THE SILENT ENGINE' },
  { depth: 6300, label: 'signals become fossils down here' },
  { depth: 7000, label: 'TRENCH CODE' },
];

function drawSky(ctx, w, surfaceY, time, deep) {
  const bottom = Math.max(1, surfaceY);
  const sky = ctx.createLinearGradient(0, 0, 0, bottom);
  sky.addColorStop(0, mix('#17445c', '#08131f', deep));
  sky.addColorStop(0.62, mix('#2b7085', '#0b2032', deep));
  sky.addColorStop(1, mix('#79b7b9', '#123048', deep));
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, bottom);

  if (deep < 0.9) {
    const sx = Math.round(w * 0.79);
    const sy = Math.round(surfaceY - w * 0.12);
    const r = Math.round(w * 0.036);
    ctx.fillStyle = `rgba(255,236,180,${0.85 * (1 - deep)})`;
    for (let y = -r; y <= r; y++) {
      const half = Math.round(Math.sqrt(Math.max(0, r * r - y * y)));
      ctx.fillRect(sx - half, sy + y, half * 2, 1);
    }
    ctx.fillStyle = `rgba(255,220,160,${0.12 * (1 - deep)})`;
    ctx.fillRect(sx - r * 3, sy - 1, r * 6, 3);
  }
}

function drawCloud(ctx, w, h, time, deep) {
  const clouds = [
    { x: 0.16, y: 0.18, s: 1.1, v: 2.2 },
    { x: 0.62, y: 0.1, s: 0.8, v: 1.4 },
    { x: 0.86, y: 0.26, s: 1.4, v: 1.0 },
  ];
  ctx.save();
  for (const c of clouds) {
    const span = w + 200;
    const x = Math.round(((c.x * w + time * 0.004 * c.v) % span) - 100);
    const y = Math.round(c.y * h);
    ctx.globalAlpha = 0.75 * (1 - deep);
    ctx.fillStyle = '#e6f2ef';
    const s = c.s;
    const blocks = [[0, 12, 70, 6], [7, 7, 54, 7], [18, 0, 21, 10], [13, 4, 36, 10], [34, 5, 17, 9], [48, 10, 16, 7]];
    for (const [bx, by, bw, bh] of blocks) ctx.fillRect(x + bx * s, y + by * s, bw * s, bh * s);
    ctx.fillStyle = '#c9dce2';
    ctx.fillRect(x, y + 15 * s, 52 * s, 2 * s);
  }
  ctx.restore();
}

function drawBoat(ctx, w, surfaceY, time, deep) {
  if (deep > 0.86) return;
  const x = Math.round(w * 0.63);
  const bob = Math.round(Math.sin(time * 0.0013) * 1.5);
  const y = Math.round(surfaceY - 6 + bob);
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#082b3b';
  [[0, 0, 40, 3], [2, 3, 35, 3], [6, 6, 27, 2], [14, -9, 16, 10], [16, -11, 18, 2], [18, -25, 2, 17], [35, -3, 9, 3]].forEach((b) => ctx.fillRect(...b));
  ctx.fillStyle = '#b9ddea';
  ctx.fillRect(17, -7, 3, 5);
  ctx.fillRect(23, -7, 3, 5);
  ctx.fillStyle = '#fa4e89';
  ctx.fillRect(10, -25, 8, 5);
  ctx.fillRect(8, -23, 3, 2);
  ctx.restore();
}

function drawWaves(ctx, w, surfaceY, time) {
  ctx.save();
  const y = Math.round(surfaceY);
  ctx.fillStyle = '#e8fbff';
  ctx.globalAlpha = 0.55;
  for (let x = 0; x < w; x += 26) {
    const off = Math.round(Math.sin((x + time * 0.06) * 0.05) * 2);
    ctx.fillRect(x + off, y - 2, 13, 1);
    ctx.fillRect(x + 5 + off, y + 1, 9, 1);
  }
  ctx.globalAlpha = 0.16;
  ctx.fillStyle = '#bff0ff';
  ctx.fillRect(0, y, w, 2);
  ctx.restore();
}

function drawRays(ctx, w, surfaceY, time, deep) {
  if (deep > 0.72) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 6; i++) {
    const x = ((i / 6) * w * 1.2 - w * 0.1 + Math.sin(time * 0.0004 + i) * 12) | 0;
    const len = 120 + ((i * 37) % 110);
    const grad = ctx.createLinearGradient(x, surfaceY, x + 46, surfaceY + len);
    grad.addColorStop(0, `rgba(150,235,255,${0.16 * (1 - deep)})`);
    grad.addColorStop(1, 'rgba(150,235,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x, surfaceY);
    ctx.lineTo(x + 22, surfaceY);
    ctx.lineTo(x + 62, surfaceY + len);
    ctx.lineTo(x + 30, surfaceY + len);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawSnow(ctx, w, h, flakes, time, deep) {
  ctx.save();
  for (const f of flakes) {
    const y = ((f.y + time * 0.00012 * f.v) % 1) * h;
    const x = f.x * w;
    ctx.globalAlpha = 0.18 + f.a * 0.5;
    ctx.fillStyle = f.big && deep < 0.5 ? '#dff7ff' : '#9fc4d8';
    ctx.fillRect(x | 0, y | 0, f.big ? 2 : 1, f.big ? 2 : 1);
  }
  ctx.restore();
}

function drawBandLines(ctx, w, h, surfaceY, depth, spacing = 0.17) {
  ctx.save();
  ctx.globalAlpha = 0.22;
  for (const band of BANDS_LOOK) {
    const y = Math.round(surfaceY + (band.depth - depth) * spacing);
    if (y < surfaceY + 8 || y > h) continue;
    ctx.fillStyle = '#6fa8c4';
    for (let x = 6; x < w; x += 18) ctx.fillRect(x, y, 9, 1);
  }
  ctx.restore();
}

/* Vertical speed lines while the camera plunges. */
function drawStreaks(ctx, w, h, time, rush, surfaceY) {
  if (rush < 0.03) return;
  const top = Math.max(0, surfaceY);
  const span = Math.max(1, h - top);
  ctx.save();
  ctx.globalAlpha = 0.14 + rush * 0.3;
  ctx.fillStyle = '#cdefff';
  for (let i = 0; i < 28; i++) {
    const x = ((i * 53.7 + Math.sin(time * 0.002 + i) * 9) % w + w) % w;
    const len = Math.round(8 + ((i * 37) % 34) * rush);
    const y = top + (((time * (0.3 + rush * 2.2)) + i * 71) % span);
    ctx.fillRect(x | 0, y | 0, 1, len);
  }
  ctx.restore();
}

function drawBubbles(ctx, w, h, bubbles) {
  if (!bubbles || !bubbles.length) return;
  ctx.save();
  for (const b of bubbles) {
    const x = Math.round(b.x * w);
    const y = Math.round(b.y * h);
    const s = b.size;
    ctx.globalAlpha = b.a;
    ctx.fillStyle = s > 1 ? '#e9fbff' : '#9fd8ea';
    ctx.fillRect(x - s, y - s, s * 2, s);
    ctx.fillRect(x, y - s * 2, s, s);
  }
  ctx.restore();
}

function drawSpeedVignette(ctx, w, h, rush) {
  if (rush < 0.04) return;
  ctx.save();
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, `rgba(1,6,14,${0.3 * rush})`);
  grad.addColorStop(0.45, 'rgba(1,6,14,0)');
  grad.addColorStop(1, `rgba(0,3,8,${0.45 * rush})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
  ctx.restore();
}

function drawFish(ctx, x, y, size, dir, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#7fd6e8';
  const s = size;
  ctx.fillRect(x, y + s, s * 5, s * 2);
  ctx.fillRect(x + s, y, s * 3, s);
  ctx.fillRect(x + s, y + s * 3, s * 3, s);
  ctx.fillRect(x - s * 2, y, s * 2, s);
  ctx.fillRect(x - s * 2, y + s * 3, s * 2, s);
  ctx.fillStyle = '#0b1c2b';
  ctx.fillRect(dir > 0 ? x + s * 4 : x + s, y + s, s, s);
  ctx.restore();
}

function drawJelly(ctx, x, y, size, time, alpha) {
  const sway = Math.round(Math.sin(time * 0.0016 + x) * 3);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#c9a6ff';
  ctx.fillRect(x - size, y + size * 0.5, size * 2, size * 0.8);
  ctx.fillRect(x - size * 0.7, y, size * 1.4, size * 0.6);
  ctx.fillStyle = '#9d7bff';
  for (let i = 0; i < 4; i++) {
    const tx = x - size * 0.7 + i * size * 0.45 + (i % 2 ? sway : -sway);
    ctx.fillRect(tx, y + size * 1.2, 1, size * (1.6 + (i % 3) * 0.5));
  }
  ctx.restore();
}

function drawWhale(ctx, w, depth, time, alpha) {
  const x = Math.round(((time * 0.004) % (w + 220)) - 190);
  const y = Math.round((depth - 2600) * 0.06);
  if (y < -40 || y > 700) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#0b2337';
  ctx.fillRect(x, y, 92, 16);
  ctx.fillRect(x + 92, y + 4, 14, 8);
  ctx.fillRect(x - 26, y + 4, 26, 8);
  ctx.fillRect(x + 22, y + 16, 40, 6);
  ctx.fillStyle = '#123a52';
  ctx.fillRect(x + 8, y + 16, 24, 4);
  ctx.restore();
}

function drawKelp(ctx, w, h, time, deep, reduced) {
  if (deep > 0.8) return;
  ctx.save();
  ctx.globalAlpha = 0.55 * (1 - deep);
  for (let i = 0; i < 7; i++) {
    const baseX = 8 + i * (w / 7) + (i % 2) * 8;
    const height = 40 + ((i * 29) % 60);
    const sway = reduced ? 0 : Math.sin(time * 0.0012 + i) * 4;
    ctx.fillStyle = i % 2 ? '#1f6152' : '#174a44';
    for (let s = 0; s < height; s += 6) {
      const x = baseX + Math.sin((s / height) * 3 + time * 0.001 + i) * sway;
      ctx.fillRect(x | 0, h - s, 3, 6);
    }
    ctx.fillStyle = '#2a7a63';
    ctx.fillRect((baseX + sway) | 0, h - height, 2, 4);
  }
  ctx.restore();
}

function drawRocks(ctx, w, h, depth, time, reduced) {
  const start = 4200;
  if (depth < start - 800) return;
  const t = clamp((depth - (start - 800)) / 1600, 0, 1);
  ctx.save();
  ctx.globalAlpha = 0.85 * t;
  ctx.fillStyle = '#04101c';
  ctx.beginPath();
  ctx.moveTo(0, h);
  const step = 26;
  for (let x = 0; x <= w; x += step) {
    const jag = ((x * 37) % 43) - 18;
    ctx.lineTo(x, h - 40 - jag);
  }
  ctx.lineTo(w, h);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#0a2233';
  for (let i = 0; i < 10; i++) {
    const x = (i * 73) % w;
    const y = h - 34 - ((i * 31) % 40);
    ctx.fillRect(x, y, 3, 3);
  }
  if (!reduced) {
    ctx.globalAlpha = 0.25 * t;
    ctx.fillStyle = '#3ea9c9';
    for (let i = 0; i < 5; i++) {
      const x = (i * 131 + Math.sin(time * 0.001 + i) * 6) % w;
      ctx.fillRect(x | 0, h - 60 - (i % 3) * 18, 1, 4);
    }
  }
  ctx.restore();
}

/* ---- src/ocean.mjs ---- */
/* Canvas ocean. Rendered at a third of CSS size and upscaled, which keeps the
   pixel edges hard and the frame cost low on phones.

   Depth is the camera: the surface line, the band marker lines, the whale and
   the trench rocks all slide past as you sink. `rush` (0-1) drives the descent
   effects while a round is being scored. */
const MODES = { intro: 0.56, play: 0.235, results: 0.34 };

class Scene {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.w = 0;
    this.h = 0;
    this.time = 0;
    this.depth = 0;
    this.target = 0;
    this.mode = 'intro';
    this.surfaceY = 0;
    this.last = 0;
    this.lastPaint = performance.now();
    this.reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.lowPower = false;
    this.rush = 0;
    this.bubbles = [];
    this.flakes = [];
    this.fish = [];
    this.jellies = [];
    this.resize();
    this.draw();
    globalThis.addEventListener('resize', () => this.resize());
    requestAnimationFrame((t) => this.frame(t));
  }

  resize() {
    this.w = Math.max(160, Math.ceil(globalThis.innerWidth / 3));
    this.h = Math.max(160, Math.ceil(globalThis.innerHeight / 3));
    this.canvas.width = this.w;
    this.canvas.height = this.h;
    this.ctx.imageSmoothingEnabled = false;
    this.surfaceY = this.h * MODES[this.mode];
    this.seed();
  }

  seed() {
    const flakes = this.lowPower ? 26 : 74;
    this.flakes = Array.from({ length: flakes }, (_, i) => ({
      x: Math.random(),
      y: Math.random(),
      v: 0.5 + Math.random() * 1.6,
      a: Math.random(),
      big: i % 7 === 0,
    }));
    this.fish = Array.from({ length: this.lowPower ? 3 : 7 }, () => ({
      x: Math.random(),
      y: 0.15 + Math.random() * 0.75,
      size: 1 + Math.floor(Math.random() * 2),
      dir: Math.random() < 0.5 ? 1 : -1,
      speed: 0.2 + Math.random() * 0.7,
      depth: Math.random() * 4200,
    }));
    this.jellies = Array.from({ length: this.lowPower ? 1 : 3 }, () => ({
      x: 0.15 + Math.random() * 0.7,
      y: Math.random(),
      size: 4 + Math.floor(Math.random() * 4),
      depth: 900 + Math.random() * 4000,
    }));
  }

  setMode(mode) {
    this.mode = mode;
  }

  setDepth(metres, instant = false) {
    this.target = Math.max(0, metres || 0);
    if (instant) this.depth = this.target;
  }

  /** 0 = drifting, 1 = plunging. */
  setRush(value) {
    this.rush = clamp(Number(value) || 0, 0, 1);
  }

  burst(count = 18) {
    for (let i = 0; i < count; i++) {
      this.bubbles.push({
        x: Math.random(),
        y: 0.55 + Math.random() * 0.5,
        v: 0.6 + Math.random() * 1.4,
        size: Math.random() < 0.25 ? 2 : 1,
        a: 0.35 + Math.random() * 0.5,
      });
    }
    if (this.bubbles.length > 110) this.bubbles.splice(0, this.bubbles.length - 110);
  }

  setReduced(reduced) {
    this.reduced = reduced;
  }

  setLowPower(low) {
    this.lowPower = low;
    this.seed();
  }

  /* True when the tab is occluded and requestAnimationFrame has stopped. */
  stalled() {
    return performance.now() - this.lastPaint > 600;
  }

  frame(t) {
    const dt = Math.min(64, t - this.last || 16);
    this.last = t;
    this.lastPaint = performance.now();
    if (!this.reduced) this.time += dt;
    const desired = this.h * MODES[this.mode];
    this.surfaceY += (desired - this.surfaceY) * (this.reduced ? 1 : 0.045);
    const ease = this.rush > 0.05 ? 1 : this.reduced ? 1 : 0.045;
    this.depth += (this.target - this.depth) * ease;
    if (Math.abs(this.target - this.depth) < 0.4) this.depth = this.target;

    for (const b of this.bubbles) {
      b.y -= (0.00012 + this.rush * 0.0006) * b.v * dt;
      b.x += Math.sin((this.time + b.y * 4000) * 0.004) * 0.00012;
    }
    this.bubbles = this.bubbles.filter((b) => b.y > -0.08);
    if (this.rush > 0.1 && this.bubbles.length < 70 && Math.random() < this.rush * 0.5) this.burst(2);

    this.draw();
    requestAnimationFrame((next) => this.frame(next));
  }

  draw() {
    const { ctx, w, h } = this;
    const deep = clamp(this.depth / 7000, 0, 1);
    const surfaceY = Math.round(this.surfaceY - Math.min(this.depth, 12000) * 0.16);
    ctx.clearRect(0, 0, w, h);

    drawSky(ctx, w, surfaceY, this.time, deep);
    drawCloud(ctx, w, h, this.time, deep);
    drawBoat(ctx, w, surfaceY, this.time, deep);

    const waterTop = Math.max(0, surfaceY);
    const water = ctx.createLinearGradient(0, waterTop, 0, h);
    water.addColorStop(0, `rgb(${18 - 12 * deep},${58 - 40 * deep},${76 - 52 * deep})`);
    water.addColorStop(0.45, `rgb(${10 - 6 * deep},${32 - 22 * deep},${48 - 32 * deep})`);
    water.addColorStop(1, `rgb(${4 - 2 * deep},${12 - 7 * deep},${22 - 13 * deep})`);
    ctx.fillStyle = water;
    ctx.fillRect(0, waterTop, w, h - waterTop);

    drawRays(ctx, w, surfaceY, this.time, deep);
    drawBandLines(ctx, w, h, surfaceY, this.depth, 0.17);
    drawSnow(ctx, w, h, this.flakes, this.time, deep);
    drawStreaks(ctx, w, h, this.time, this.rush, surfaceY);

    for (const f of this.fish) {
      const alpha = clamp(0.55 - Math.abs(f.depth - this.depth) / 5200, 0.08, 0.55);
      const y = f.y * h;
      const span = w + 80;
      let x = ((f.x * span + this.time * 0.004 * f.speed * span * 0.02 * f.dir) % span) - 40;
      if (x < -40) x += span;
      drawFish(ctx, Math.round(x), Math.round(clamp(y, waterTop + 20, h - 24)), 2 + f.size, f.dir, alpha);
    }

    for (const j of this.jellies) {
      if (this.depth < j.depth - 1600) continue;
      const alpha = clamp(0.5 - Math.abs(j.depth - this.depth) / 4200, 0.06, 0.5);
      drawJelly(ctx, Math.round(j.x * w), Math.round(j.y * h), j.size, this.time, alpha);
    }

    if (this.depth > 2100) drawWhale(ctx, w, this.depth, this.time, clamp((this.depth - 2100) / 1800, 0, 0.22));
    drawKelp(ctx, w, h, this.time, deep, this.reduced);
    drawRocks(ctx, w, h, this.depth, this.time, this.reduced);
    drawBubbles(ctx, w, h, this.bubbles);

    if (surfaceY > 0) {
      ctx.fillStyle = '#a8e9f5';
      ctx.globalAlpha = 0.5;
      ctx.fillRect(0, surfaceY, w, 1);
      ctx.globalAlpha = 1;
      drawWaves(ctx, w, surfaceY, this.time);
    }

    // Deep-water vignette grows with depth so the trench feels darker than the sky.
    if (deep > 0.35) {
      ctx.save();
      ctx.globalAlpha = (deep - 0.35) * 0.55;
      ctx.fillStyle = '#01040a';
      ctx.fillRect(0, 0, w, h * 0.18);
      ctx.restore();
    }
    drawSpeedVignette(ctx, w, h, this.rush);
  }
}

/* ---- src/shell.mjs ---- */
/* The page chrome, mounted once. Both modes share the same DOM; applyCopy()
   swaps the handful of strings that differ. Everything stays on one page. */
const COPY = {
  daily: {
    label: 'Krillion daily trivia dive',
    tagline: 'THE DAILY DIVE',
    subline: '7 prompts · 25 seconds each · rarer answers sink deeper',
    day: 'DIVE …',

function applyCopy(mode) {
  const c = COPY[mode] || COPY.daily;
  const key = c === COPY.unlimited ? 'unlimited' : 'daily';
  document.documentElement.dataset.mode = key;
  document.title = key === 'unlimited' ? 'Krillion Unlimited — endless dives' : 'Krillion — the daily dive';
  const text = (sel, value) => {
    const el = document.querySelector(sel);
    if (el) el.textContent = value;
  };
  text('#tagline', c.tagline);
  text('#subline', c.subline);
  text('#day-number', c.day);
  const list = document.querySelector('#how-to-list');
  if (list) list.innerHTML = c.howTo.map((line) => `<li>${line}</li>`).join('');
  for (const button of document.querySelectorAll('.mode-switch [data-mode]')) {
    if (button.dataset.mode === (c === COPY.unlimited ? 'unlimited' : 'daily')) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  }
}

/* ---- src/app.mjs ---- */
/* Krillion static replica: one page, no navigation, no server required.
   Daily and Unlimited both live here; switching mode swaps copy and data in
   place. All state stays in the browser. */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const metaFor = (tier) => {
  const key = tierKey(tier);
  return key ? { key, ...TIERS[key] } : null;
};

const initialQuery = new URLSearchParams(location.search);
let mode = initialQuery.get('mode') === 'unlimited' || (!initialQuery.has('mode') && initialQuery.has('id'))
  ? 'unlimited'
  : 'daily';

const body = document.body;

let settings = { ...DEFAULT_SETTINGS, ...getSettings() };
let game = null;
let dive = null;
let day = null;
let scene = null;
let rulerTrack = null;
let rulerScale = 0;
let rulerAnchor = 0;
let timerLoop = null;
let lastTickSecond = null;
let resetTimer = null;
let scoreAnim = 0;
let scoreToken = 0;
let descentToken = 0;
let revisitResult = null;

const sound = new Sound(settings.sound);

/* ---------- boot ---------- */
mountShell($('#game'));
applyCopy(mode);
buildHero();
scene = new Scene($('#ocean'));
buildDepthNotes();
buildRuler();
applySettings();
wireEvents();
loadGame();

function buildHero() {
  const word = $('#hero-word');
  if (word) word.innerHTML = [...'KRILLION'].map((ch, i) => `<span style="--letter:${i}">${ch}</span>`).join('');
}

function buildDepthNotes() {
  const host = document.createElement('div');
  host.className = 'depth-notes';
  host.id = 'depth-notes';
  host.setAttribute('aria-hidden', 'true');
  host.innerHTML = BANDS_LOOK.map((b) => `<div class="depth-note" data-depth="${b.depth}">${esc(b.label)}</div>`).join('');
  $('#game').append(host);
}

/* Depth ruler: hundreds of metres on the right, with a fixed YOU line. */
function buildRuler() {
  rulerTrack = $('#ruler-track');
  if (!rulerTrack) return;
  const frag = document.createDocumentFragment();
  for (let depth = 0; depth <= 7200; depth += 100) {
    const tick = document.createElement('i');
    tick.className = 'ruler-tick';
    tick.innerHTML = `<span>${depth}m</span>`;
    frag.append(tick);
  }
  rulerTrack.append(frag);
  layoutRuler();
}

function layoutRuler() {
  if (!rulerTrack) return;
  rulerScale = window.innerHeight * 0.0015;
  rulerAnchor = window.innerHeight * 0.38;
  [...rulerTrack.children].forEach((tick, i) => {
    tick.style.top = `${i * 100 * rulerScale}px`;
  });
  updateRuler(scene ? scene.depth : 0);
}

function updateRuler(metres) {
  if (!rulerTrack || !rulerScale) return;
  rulerTrack.style.transform = `translateY(${(rulerAnchor - metres * rulerScale).toFixed(1)}px)`;
}

async function loadGame() {
  const startBtn = $('#start-btn');
  startBtn.disabled = true;
  startBtn.textContent = '… LOADING …';
  const query = new URLSearchParams(location.search);
  let stale = false;
  let requestedDay = null;
  try {
    if (mode === 'daily') {
      const asked = Number(query.get('day'));
      const explicit = Number.isFinite(asked) && asked > 0;
      requestedDay = explicit ? Math.floor(asked) : todayDay();
      day = requestedDay;
      game = await loadDaily(day, { previousFallback: !explicit });
      day = game.dayNumber ?? day;
      /* Today's file is not always up yet; the loader steps back a day so the
         dive still plays, and the note says which day is actually running. */
      stale = !explicit && !game.sample && !game.fallback && day !== requestedDay;
      $('#day-number').textContent = `DIVE #${day}${game.date && !game.sample ? ` · ${formatDate(game.date)}` : ''}`;
      revisitResult = findResult('daily', day);
      if (revisitResult) startBtn.textContent = '▼ SEE TODAY’S DIVE ▼';
    } else {
      const asked = Number(query.get('id'));
      let id = Number.isFinite(asked) && asked > 0 ? Math.floor(asked) : null;
      if (!id) id = pickUnlimitedId(await loadManifest(), playedUnlimited());
      game = await loadUnlimited(id);
      day = id;
      $('#day-number').textContent = `DIVE ∞ #${day}`;
      updateUrl();
    }
    if (game.sample || game.fallback) {
      const note = $('#sample-note');
      note.hidden = false;
      note.textContent = game.offline
        ? (mode === 'daily'
          ? `Offline dive · daily/game_${day}.json could not be reached, so the bundled pack is playing.`
          : `Offline dive · the unlimited pool could not be reached, so seven bundled prompts are playing.`)
        : (mode === 'daily'
          ? `Sample dive · daily/game_${day}.json is not published yet, so the bundled bank is playing.`
          : `Sample dive · the unlimited pool was incomplete, so a bundled set is playing.`);
    } else if (stale) {
      const note = $('#sample-note');
      note.hidden = false;
      note.textContent = `Dive #${requestedDay} is not published yet · playing dive #${day}${game.date ? ` · ${formatDate(game.date)}` : ''}.`;
    }
    startBtn.disabled = false;
    startBtn.textContent = revisitResult ? '▼ SEE TODAY’S DIVE ▼' : '▼ BEGIN DESCENT ▼';
  } catch (err) {
    const box = $('#boot-error');
    box.hidden = false;
    box.textContent = `The dive could not be loaded. ${err.message}`;
  }
}

function formatDate(iso) {
  const d = new Date(`${iso}T12:00:00Z`);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }).toUpperCase();
}

function updateUrl() {
  try {
    const url = new URL(location.href);
    if (mode === 'unlimited') {
      url.searchParams.set('mode', 'unlimited');
      if (day) url.searchParams.set('id', String(day));
    } else {
      url.searchParams.delete('mode');
      url.searchParams.delete('id');
    }
    history.replaceState(null, '', url);
  } catch {
    /* file: URLs may refuse history edits; the page still works */
  }
}

/* ---------- settings ---------- */
function applySettings() {
  body.dataset.lowpower = String(!!settings.lowPower);
  body.dataset.colorblind = String(!!settings.colorblind);
  if (scene) scene.setLowPower(!!settings.lowPower);
  sound.setEnabled(!!settings.sound);
  const mute = $('#mute-btn');
  if (mute) {
    mute.setAttribute('aria-pressed', String(!settings.sound));
    mute.setAttribute('aria-label', settings.sound ? 'Turn sound off' : 'Turn sound on');
    mute.style.color = settings.sound ? '' : '#4a6076';
  }
}

function saveSetting(key, value) {
  settings = { ...settings, [key]: value };
  saveSettings(settings);
  applySettings();
}

/* ---------- mode switching (stays on one page) ---------- */
function switchMode(next) {
  if (next !== 'daily' && next !== 'unlimited') return;
  if (next === mode && game) return;
  mode = next;
  resetToIntro();
  applyCopy(mode);
  updateUrl();
  loadGame();
}

function resetToIntro() {
  descentToken += 1;
  clearInterval(timerLoop);
  timerLoop = null;
  clearInterval(resetTimer);
  resetTimer = null;
  dive = null;
  game = null;
  day = null;
  revisitResult = null;
  body.dataset.phase = 'intro';
  body.classList.remove('timer-hot');
  scene.setMode('intro');
  scene.setDepth(0, true);
  scene.setRush(0);
  setScore(0);
  setDepthText(0);
  $('#intro').inert = false;
  $('#hero').inert = false;
  $('#results').hidden = true;
  $('#results').innerHTML = '';
  $('#prompt-card').hidden = true;
  $('#answer-dock').hidden = true;
  $('#landing').hidden = true;
  $('#landing').classList.remove('hit');
  $('#next-wrap').hidden = true;
  $('#preview-label').hidden = true;
  $('#answer').disabled = true;
  $('#answer').value = '';
  $('#answer-status').textContent = '';
  $('#answer-status').className = 'answer-status';
  $('#round-label').textContent = 'SURFACE';
  $('#sample-note').hidden = true;
  $('#boot-error').hidden = true;
  const startBtn = $('#start-btn');
  startBtn.disabled = true;
  startBtn.textContent = '▼ BEGIN DESCENT ▼';
  for (const dot of $$('#round-dots i')) dot.className = '';
  $('#depth').classList.remove('bump');
  $('#score').classList.remove('bump');
  const burst = $('#game .burst');
  if (burst) burst.remove();
  resetPlungeUI();
}

async function anotherDive() {
  mode = 'unlimited';
  resetToIntro();
  applyCopy(mode);
  try {
    const url = new URL(location.href);
    url.searchParams.set('mode', 'unlimited');
    url.searchParams.delete('id');
    history.replaceState(null, '', url);
  } catch {
    /* ignore */
  }
  await loadGame();
  if (game) startDive();
}

/* ---------- dive ---------- */
function startDive() {
  if (!game) return;
  sound.ensure();
  scene.setMode('play');
  scene.setDepth(0, true);
  scene.setRush(0);
  dive = new Dive({ prompts: game.prompts, settings });
  dive.start();
  clearInterval(timerLoop);
  lastTickSecond = null;
  body.dataset.phase = 'preview';
  $('#intro').inert = true;
  $('#hero').inert = true;
  $('#prompt-card').hidden = false;
  $('#landing').hidden = true;
  $('#landing').classList.remove('hit');
  $('#next-wrap').hidden = true;
  $('#results').hidden = true;
  $('#answer-dock').hidden = true;
  $('#preview-label').hidden = false;
  $('#answer').value = '';
  $('#answer').disabled = true;
  $('#answer-status').textContent = '';
  $('#answer-status').className = 'answer-status';
  $('#timer-number').textContent = '3';
  $('#round-label').textContent = 'SURFACE';
  setDepth(0);
  setScore(0);
  updateDots();
  renderPrompt();
  updatePreview();
  resetPlungeUI();
  sound.start();
  scene.burst(16);
  rushPulse(1200, 0.85);
  timerLoop = setInterval(onTick, 80);
}

function onTick() {
  if (!dive || dive.phase === 'done' || dive.phase === 'landing') return;
  if (dive.pausedAt) return;
  const change = dive.tick();
  if (change === 'answer') enterAnswer();
  if (dive.phase === 'preview') updatePreview();
  if (dive.phase === 'answer') {
    updateTimer();
    if (dive.expired()) return handleTimeout();
  }
}

function enterAnswer() {
  body.dataset.phase = 'answer';
  $('#preview-label').hidden = true;
  $('#answer-dock').hidden = false;
  $('#answer').disabled = false;
  $('#answer').focus({ preventScroll: true });
  $('#round-label').textContent = `PROMPT ${dive.round} OF ${ROUNDS}`;
  updateTimer();
}

function updatePreview() {
  const left = Math.max(1, Math.ceil((dive.previewUntil - Date.now()) / 1000));
  $('#preview-label').innerHTML = `descending · the clock starts in <b>${left}</b>`;
  $('#timer-number').textContent = String(left);
  document.documentElement.style.setProperty('--time', '1');
}

function updateTimer() {
  const ms = dive.remaining();
  const secs = Math.ceil(ms / 1000);
  $('#timer-number').textContent = String(secs);
  document.documentElement.style.setProperty('--time', String(Math.max(0, ms / ROUND_MS)));
  const hot = ms <= 3000;
  body.classList.toggle('timer-hot', hot);
  if (hot && secs !== lastTickSecond && secs > 0) {
    lastTickSecond = secs;
    sound.tick();
  }
}

function renderPrompt() {
  const q = dive?.prompt;
  if (!q) return;
  $('#prompt-number').textContent = `PROMPT ${dive.round} OF ${ROUNDS}`;
  $('#prompt-text').textContent = q.text;
}

function onSubmit(event) {
  event.preventDefault();
  if (!dive || dive.phase !== 'answer') return;
  const value = $('#answer').value;
  if (!value.trim()) {
    $('#answer-status').textContent = 'type an answer, or let the clock run.';
    return;
  }
  handleOutcome(dive.submit(value));
}

function handleOutcome(outcome) {
  if (!dive) return;
  if (outcome.type === 'empty') {
    $('#answer-status').textContent = 'type an answer, or let the clock run.';
    return;
  }
  if (outcome.type === 'reject') {
    sound.reject();
    const form = $('#answer-form');
    form.classList.remove('shake');
    void form.offsetWidth;
    form.classList.add('shake');
    const err = $('#answer-status');
    err.className = 'answer-status';
    err.textContent = 'no echo down here — that one is not on the list. try another.';
    if (settings.clearRejected) $('#answer').value = '';
    $('#answer').focus({ preventScroll: true });
    return;
  }
  if (outcome.type === 'correction') {
    sound.submit();
    const typed = $('#answer').value.trim();
    const answer = outcome.match.answer;
    $('#answer').value = answer;
    const err = $('#answer-status');
    err.className = 'answer-status correction';
    err.innerHTML = `<span><b>“${esc(typed)}”</b> → corrects to <b>“${esc(answer)}”</b></span><small>submit again to confirm · or edit</small>`;
    $('#answer').focus({ preventScroll: true });
    $('#answer').setSelectionRange(answer.length, answer.length);
    return;
  }
  complete(outcome.result);
}

function handleTimeout() {
  if (!dive || dive.phase !== 'answer') return;
  sound.timeout();
  if (dive.pending) return complete(dive.acceptPending());
  const text = $('#answer').value;
  if (text.trim()) {
    const outcome = dive.submit(text);
    if (outcome.type === 'result') return complete(outcome.result);
    if (outcome.type === 'correction') return complete(dive.acceptPending());
    return complete(dive.finish(null, text, false));
  }
  complete(dive.finish(null, '', false));
}

function complete(result) {
  if (!dive || !result) return;
  clearInterval(timerLoop);
  timerLoop = null;
  body.classList.remove('timer-hot');
  $('#answer').disabled = true;
  $('#answer-dock').hidden = true;
  $('#answer-status').textContent = '';
  $('#round-label').textContent = `PROMPT ${dive.round} OF ${ROUNDS}`;
  updateDots();
  plunge(result);
}

/* The answer falls first: a chip drops down the tier ladder, the camera
   follows it, and only then does the landing card arrive. */
function plunge(result) {
  const meta = metaFor(result.tier);
  const color = meta ? meta.color : '#7d93b8';
  const prompt = $('#prompt-card');
  if (!prompt.hidden) {
    prompt.classList.add('leaving');
    setTimeout(() => {
      prompt.hidden = true;
      prompt.classList.remove('leaving');
    }, 650);
  }

  body.dataset.phase = 'plunge';
  body.dataset.tier = meta?.key || 'miss';
  const chip = $('#falling-answer');
  chip.hidden = false;
  chip.classList.remove('landed');
  chip.style.opacity = '1';
  chip.style.setProperty('--chip', color);
  const shown = result.answer || result.raw;
  $('#falling-label').textContent = shown ? `“${String(shown).toUpperCase()}”` : '—';
  const ladder = $('#tier-ladder');
  ladder.innerHTML = meta ? ladderHTML(meta.key) : '';
  ladder.hidden = !meta;

  if (meta) {
    sound.correct(meta.key);
    sound.whoosh((760 + meta.score * 8) / 1000);
  } else {
    sound.reject();
  }

  const fromScore = Math.max(0, dive.score - result.score);
  const from = fromScore * 10;
  const to = dive.score * 10;
  /* The reference sink: slowest at the trench tiers, quick on a miss. */
  const duration = meta ? DROP_MS[meta.key] || 3400 : 900;

  runPlunge({ from, to, duration, meta, chip, ladder }).then((ok) => {
    if (!ok || !dive) return;
    chip.hidden = true;
    chip.style.opacity = '1';
    ladder.hidden = true;
    ladder.innerHTML = '';
    land(result);
  });
}

function ladderHTML(own) {
  return Object.entries(TIERS)
    .sort((a, b) => b[1].score - a[1].score)
    .map(([id, t]) => `<div class="tier-line${id === own ? ' own' : ''}" data-score="${t.score}" style="--line:${t.color}"><span>${tierImage(id)}${esc(t.name.toUpperCase())} · ${t.score}</span></div>`)
    .join('');
}

/* Sink times copied from the reference, in milliseconds. */
const DROP_MS = { plankton: 3400, tooclever: 3000, schooler: 3000, rare: 3400, deepcut: 4300, krillion: 4600 };
const easeInOut = (p) => (p < 0.5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2);
const easeCosine = (p) => (1 - Math.cos(Math.PI * p)) / 2;

/* The chip rocks as it falls. Plankton drifts widest, Too Clever buzzes, and
   the rare tiers swing once before settling. */
function chipSway(tier, p) {
  if (tier === 'plankton') return 36 * Math.sin(p * 7) * (1 - 0.25 * p);
  if (tier === 'tooclever') return 7 * Math.sin(p * 42);
  return Math.sin(p * (tier === 'krillion' ? 24 : 16)) * (1 - p) * (tier === 'krillion' ? 26 : 14);
}

/* One rAF loop drives the camera, the chip and the tier ladder. The chip keeps
   the YOU line on screen while the ocean drops; the ladder is anchored to real
   depths, so lines scroll up past it instead of sitting at fixed positions. */
function runPlunge({ from, to, duration, meta, chip, ladder }) {
  return new Promise((resolve) => {
    const token = ++descentToken;
    const startTime = performance.now();
    const tier = meta?.key || 'miss';
    const lines = [...ladder.querySelectorAll('.tier-line')].map((el) => ({ el, depth: from + Number(el.dataset.score) * 10, passed: false }));
    let settled = false;
    const height = window.innerHeight;
    const scale = height * 0.0015;
    /* Same line the chip and the YOU marker sit on, so the answer's own tier
       line finishes exactly under the chip instead of sailing past it. */
    const anchor = height * 0.38;
    chip.style.top = `${anchor.toFixed(1)}px`;
    const finish = () => {
      if (settled) return;
      settled = true;
      if (token !== descentToken) return resolve(false);
      scene.setDepth(to, true);
      scene.setRush(0);
      setDepthText(to);
      updateNotes(to);
      const own = lines.find((line) => line.el.classList.contains('own'));
      if (own) own.el.classList.add('hit');
      chip.classList.add('landed');
      /* A short beat on the line before the landing card replaces it. */
      setTimeout(() => {
        if (token !== descentToken) return resolve(false);
        resolve(true);
      }, 280);
    };
    const step = (t) => {
      if (token !== descentToken) return finish();
      const p = clamp01((t - startTime) / duration);
      const eased = tier === 'plankton' ? easeCosine(p) : easeInOut(p);
      const metres = from + (to - from) * eased;
      scene.setDepth(metres, true);
      setDepthText(metres);
      updateNotes(metres);
      scene.setRush(p < 1 ? clamp01(1 - p * 0.85) : 0);
      const sway = chipSway(tier, p);
      chip.style.setProperty('--sway', `${sway.toFixed(1)}px`);
      chip.style.setProperty('--tilt', `${(sway * (tier === 'plankton' ? 0.55 : 0.4)).toFixed(2)}deg`);
      for (const line of lines) {
        const y = anchor + (line.depth - metres) * scale;
        line.el.style.top = `${y.toFixed(1)}px`;
        line.el.hidden = y < -40 || y > height + 40;
        if (!line.passed && metres + 0.5 >= line.depth) {
          line.passed = true;
          line.el.classList.add('active');
          sound.tier();
        }
      }
      if (p < 1) requestAnimationFrame(step);
      else finish();
    };
    requestAnimationFrame(step);
    setTimeout(finish, duration + 400);
  });
}

function land(result) {
  const meta = metaFor(result.tier);
  const tier = meta?.key || null;
  const color = meta ? meta.color : '#7d93b8';
  body.dataset.phase = 'landing';
  body.dataset.tier = tier || 'miss';
  const landing = $('#landing');
  landing.hidden = false;
  landing.style.setProperty('--tier', color);
  const glow = meta ? 40 + meta.score * 0.32 : 0;
  landing.style.setProperty('--glow', `${glow.toFixed(0)}%`);
  landing.style.setProperty('--glow-soft', `${(glow * 0.45).toFixed(0)}%`);
  $('#land-icon').hidden = !meta;
  if (meta) $('#land-icon').src = iconSrc(tier);
  $('#land-tier').textContent = meta ? meta.name.toUpperCase() : 'DRIFTING';
  $('#land-answer').textContent = result.answer ? `“${result.answer}”` : (result.raw ? `“${result.raw}”` : 'no answer');
  $('#land-points').textContent = meta ? `+${meta.score} PTS · sink ${(meta.score * 10).toLocaleString('en-US')}m` : 'NO DESCENT THIS ROUND';
  $('#land-quip').textContent = result.note || (meta ? meta.blurb : 'Another question waits below.');
  landing.classList.remove('hit');
  void landing.offsetWidth;
  landing.classList.add('hit');

  updateDots();
  bump('#depth');

  if (meta) {
    const fromScore = Math.max(0, dive.score - result.score);
    sound.land(tier);
    scene.burst(12 + Math.round(meta.score / 6));
    spawnBurst(color);
    animateScore(fromScore, dive.score, 480);
    bump('#score');
    if (meta.score >= 60) flash(color);
    if (tier === 'krillion') {
      flash('#ffd166');
      setTimeout(() => flash('#ffd166'), 260);
      sound.gold();
      const scoreEl = $('#score');
      scoreEl.classList.add('slam');
      setTimeout(() => scoreEl.classList.remove('slam'), 520);
    }
  } else {
    sound.land(null);
    shakeScreen();
  }
  mascotReact(tier);
  showNext();
}

function mascotReact(tier) {
  const el = $('#mascot');
  if (!el) return;
  el.classList.remove('celebrate', 'sad', 'faint');
  const word = $('#mascot-word');
  if (!tier) {
    el.classList.add('faint');
    if (word) word.textContent = 'blub…';
  } else if (tier === 'plankton' || tier === 'tooclever') {
    el.classList.add('sad');
    if (word) word.textContent = 'oh.';
  } else {
    el.classList.add('celebrate');
    if (word) word.textContent = tier === 'krillion' ? 'THE ONE!' : 'nice!';
  }
  setTimeout(() => el.classList.remove('celebrate', 'sad', 'faint'), tier === 'krillion' ? 2600 : 1700);
}

function shakeScreen() {
  const game = $('#game');
  game.classList.remove('shake-screen');
  void game.offsetWidth;
  game.classList.add('shake-screen');
  setTimeout(() => game.classList.remove('shake-screen'), 520);
}

function showNext() {
  if (!dive) return;
  const next = $('#next-btn');
  next.textContent = dive.round >= ROUNDS ? 'SURFACE ▲' : 'DESCEND ▼';
  $('#next-wrap').hidden = false;
}

function rushPulse(duration = 1100, peak = 0.8) {
  const token = ++descentToken;
  const start = performance.now();
  const step = (t) => {
    if (token !== descentToken) return;
    const p = Math.min(1, (t - start) / duration);
    scene.setRush(peak * (1 - p) ** 1.6);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  setTimeout(() => {
    if (token === descentToken) scene.setRush(0);
  }, duration + 140);
}

function spawnBurst(color = '#4de3ff') {
  const host = $('#game');
  const old = host.querySelector('.burst');
  if (old) old.remove();
  const box = document.createElement('div');
  box.className = 'burst';
  box.style.setProperty('--burst', color);
  const count = 18;
  for (let i = 0; i < count; i++) {
    const bit = document.createElement('i');
    const angle = (i / count) * Math.PI * 2 + Math.random() * 0.35;
    const distance = 70 + Math.random() * 140;
    bit.style.setProperty('--dx', `${Math.round(Math.cos(angle) * distance)}px`);
    bit.style.setProperty('--dy', `${Math.round(Math.sin(angle) * distance - 40)}px`);
    bit.style.animationDelay = `${Math.round(Math.random() * 90)}ms`;
    const size = 3 + Math.round(Math.random() * 4);
    bit.style.width = `${size}px`;
    bit.style.height = `${size}px`;
    box.append(bit);
  }
  host.append(box);
  setTimeout(() => box.remove(), 1200);
}

function bump(sel) {
  const el = $(sel);
  if (!el) return;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 600);
}

function onNext() {
  if (!dive || dive.phase !== 'landing') return;
  const phase = dive.advance();
  $('#landing').hidden = true;
  $('#landing').classList.remove('hit');
  $('#next-wrap').hidden = true;
  resetPlungeUI();
  if (phase === 'done') return showResults();
  body.dataset.phase = 'preview';
  $('#answer').value = '';
  $('#answer').disabled = true;
  $('#answer-status').textContent = '';
  $('#answer-status').className = 'answer-status';
  $('#preview-label').hidden = false;
  $('#prompt-card').hidden = false;
  renderPrompt();
  updateDots();
  $('#round-label').textContent = 'SURFACE';
  updatePreview();
  lastTickSecond = null;
  timerLoop = setInterval(onTick, 80);
}

/* ---------- hud ---------- */
function setDepth(metres) {
  if (scene) scene.setDepth(metres, true);
  setDepthText(metres);
  updateNotes(metres);
}

function setDepthText(metres) {
  const el = $('#depth');
  if (el) el.textContent = `${Math.round(metres).toLocaleString('en-US')}m`;
  updateRuler(metres);
}

function updateHud() {
  if (!scene) return;
  if (scene.stalled()) scene.setDepth(scene.target, true);
  setDepthText(scene.depth);
  updateNotes(scene.depth);
}

function updateNotes(depth) {
  const host = $('#depth-notes');
  if (!host) return;
  let shown = 0;
  for (const note of $$('.depth-note', host)) {
    const band = Number(note.dataset.depth);
    const near = Math.abs(band - depth) < 820 && shown < 3;
    note.classList.toggle('on', near);
    if (near) shown += 1;
  }
}

function animateScore(from, to, duration = 520) {
  const el = $('#score');
  const token = ++scoreToken;
  const start = performance.now();
  const step = (t) => {
    if (token !== scoreToken) return;
    const p = Math.min(1, (t - start) / duration);
    const eased = 1 - (1 - p) ** 3;
    scoreAnim = Math.round(from + (to - from) * eased);
    if (el) el.textContent = scoreAnim.toLocaleString('en-US');
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  // Guarantees the final number even if rAF is throttled by a hidden tab.
  setTimeout(() => {
    if (token !== scoreToken) return;
    scoreAnim = to;
    if (el) el.textContent = to.toLocaleString('en-US');
  }, duration + 80);
}

function setScore(value) {
  scoreToken += 1;
  scoreAnim = value;
  const el = $('#score');
  if (el) el.textContent = String(value);
}

function updateDots() {
  $$('#round-dots i').forEach((dot, i) => {
    const result = dive?.results[i];
    dot.classList.toggle('done', !!result);
    dot.classList.toggle('active', !!dive && i === dive.index && !result);
  });
}

function flash(color = 'var(--gold)') {
  const el = $('.flash');
  el.style.background = color;
  el.classList.remove('on');
  void el.offsetWidth;
  el.classList.add('on');
}

function resetPlungeUI() {
  const chip = $('#falling-answer');
  if (chip) {
    chip.hidden = true;
    chip.classList.remove('landed');
    chip.style.removeProperty('top');
    chip.style.removeProperty('--sway');
    chip.style.removeProperty('--tilt');
    chip.style.removeProperty('opacity');
  }
  const ladder = $('#tier-ladder');
  if (ladder) {
    ladder.hidden = true;
    ladder.innerHTML = '';
  }
  $('#prompt-card').classList.remove('leaving');
  $('#mascot').classList.remove('celebrate', 'sad', 'faint');
}

/* ---------- results ---------- */
function showResults(revisit = false) {
  if (!dive) return;
  clearInterval(timerLoop);
  timerLoop = null;
  body.dataset.phase = 'results';
  scene.setMode('results');
  scene.setRush(0);
  $('#prompt-card').hidden = true;
  $('#answer-dock').hidden = true;
  $('#preview-label').hidden = true;
  $('#landing').hidden = true;
  $('#next-wrap').hidden = true;
  resetPlungeUI();
  const panel = $('#results');
  panel.hidden = false;
  panel.innerHTML = resultsHTML(dive, revisit);
  panel.scrollTop = 0;
  if (!revisit) {
    addResult({ mode, key: day, score: dive.score, results: dive.results });
    sound.surface();
  }
  updateDots();
  startResetClock();
}

function resultsHTML(run, revisit) {
  const band = bandFor(run.score);
  const accepted = run.results.filter((r) => r.answer).length;
  const label = mode === 'daily' ? `DIVE #${day}` : `DIVE ∞ #${day}`;
  const date = mode === 'daily' && game?.date ? ` · ${formatDate(game.date)}` : '';
  const review = run.results.map((r, i) => reviewRow(r, i)).join('');
  const shareLine = shareLineFor(run);
  return `<div class="result-shell">
    <span class="result-brand">KRILLION${mode === 'unlimited' ? ' UNLIMITED' : ''}</span>
    <p class="result-kicker">${esc(label)}${esc(date)}</p>
    <h1>${revisit ? 'YOUR DIVE' : 'YOU SURFACED'}</h1>
    <div class="result-depth">${(run.score * 10).toLocaleString('en-US')}<span>m</span></div>
    <p class="result-points"><b>${run.score.toLocaleString('en-US')}</b> / 700 points · ${accepted} / ${ROUNDS} accepted</p>
    <p class="result-band" style="color:${TIERS[band.tier].color}">${tierImage(band.tier)} ${esc(band.name)} — ${esc(band.text)}</p>
    <div class="result-actions">
      <button class="btn gold" data-action="copy">Copy result</button>
      <button class="btn" data-action="share">Share</button>
      ${mode === 'daily'
        ? '<button class="btn" data-action="mode-unlimited">Play unlimited</button>'
        : '<button class="btn" data-action="another">Another dive</button>'}
      <button class="btn ghost" data-action="replay">Review answers</button>
    </div>
    <p class="rule">DIVE LOG · DEEPER = RARER</p>
    ${diveChart(run.results)}
    <p class="rule">THE BEARING</p>
    ${bandList(band)}
    <p class="rule">YOUR SCORE</p>
    ${distributionChart(run.score)}
    <p class="dist-note">Population comparison needs a server. This dive was scored locally, so only your own score is plotted.</p>
    <p class="rule">ANSWER REVIEW</p>
    <div class="review">${review}</div>
    <p class="reset-note" id="reset-note"></p>
    <p class="result-foot">Static build · your dives stay in this browser.<br><button class="link" data-action="mode-unlimited">Unlimited dives</button> · <button class="link" data-action="menu">Menu</button></p>
    <textarea class="sr-only" id="share-copy" readonly>${esc(shareLine)}</textarea>
  </div>`;
}

function reviewRow(result, index) {
  const meta = metaFor(result.tier);
  const mine = normalize(result.answer || '');
  const sample = reviewSample(game?.prompts[index]?.answers || [], mine);
  const list = sample.list.map((a, rank) => {
    const t = TIERS[tierKey(a.tier)] || TIERS.plankton;
    const isMine = mine && normalize(a.answer) === mine;
    return `<div class="answer-row${isMine ? ' mine' : ''}" style="--row:${t.color}">
      <span class="answer-rank">${rank + 1}</span>
      <span class="answer-icon">${tierImage(a.tier)}</span>
      <span class="answer-name">${esc(a.answer)}${isMine ? '<em>your pick</em>' : ''}</span>
      <span class="answer-tier">${esc(t.name)}</span>
      <span class="answer-pts">+${t.score}</span>
    </div>`;
  }).join('');
  return `<details style="--tier:${meta ? meta.color : '#2a4058'}">
    <summary>
      <span class="n">${index + 1}</span>
      <span class="q">${esc(result.prompt)}<small>${result.answer ? esc(result.answer) : result.raw ? `“${esc(result.raw)}” — not accepted` : 'no answer'}</small></span>
      <span class="pts">${result.score}<small>${meta ? esc(meta.name) : 'MISS'}</small></span>
    </summary>
    <div class="body">
      ${meta ? `<p>${tierImage(meta.key)} ${esc(meta.blurb)}</p>` : '<p>Nothing landed this round.</p>'}
      ${result.note ? `<p>${esc(result.note)}</p>` : ''}
      <p class="answer-head">${sample.list.length < sample.total
        ? `${sample.list.length} of ${sample.total.toLocaleString('en-US')} accepted answers · random sample, rarest first`
        : 'Every accepted answer, rarest first'}</p>
      <div class="answer-list" aria-label="Accepted answers ranked from rarest to commonest">${list}</div>
    </div>
  </details>`;
}

function baseUrl() {
  return String(location.href).split('#')[0].split('?')[0];
}

function shareUrl() {
  if (mode === 'unlimited') return `${baseUrl()}?mode=unlimited&id=${day}`;
  return baseUrl();
}

/* The "Share link" setting drops the address from copied text. */
function shareLineFor(run) {
  return shareText(day, run.results, settings.shareLink ? shareUrl() : '');
}

function startResetClock() {
  clearInterval(resetTimer);
  const el = $('#reset-note');
  if (!el) return;
  if (mode !== 'daily') {
    el.textContent = `unlimited dive #${day} · this link replays the same seven prompts.`;
    return;
  }
  const target = resetAt(etDate());
  const paint = () => {
    const left = Math.max(0, target - Date.now());
    const h = Math.floor(left / 3600000);
    const m = Math.floor((left % 3600000) / 60000);
    const s = Math.floor((left % 60000) / 1000);
    el.textContent = left ? `next dive in ${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : 'the next dive is ready — reload to descend.';
  };
  paint();
  resetTimer = setInterval(paint, 1000);
}

async function copyResult() {
  if (!dive) return;
  const text = shareLineFor(dive);
  try {
    await navigator.clipboard.writeText(text);
    toast('result copied.');
  } catch {
    const box = $('#share-copy');
    if (box) {
      box.value = text;
      box.select();
      toast('press copy to take the result.');
    }
  }
}

/* ---------- menus ---------- */
function openPanel(kind) {
  const panel = $('#panel');
  dive?.pause();
  $('#panel-body').innerHTML = panelHTML(kind);
  if (!panel.open) panel.showModal();
}

function panelHTML(kind) {
  const head = (title) => `<div class="panel-head"><h2 id="panel-title">${title}</h2><button class="close" data-close aria-label="Close">X</button></div>`;
  if (kind === 'menu') {
    return `<div class="panel-inner">
      <p class="menu-kicker">KRILLION</p>
      ${head('MENU')}
      <p class="rule">DIVE IN</p>
      <nav class="menu-grid" aria-label="Game menu">

        <button data-panel="buddy"><span class="menu-symbol">✦</span><span>Dive buddy</span></button>

      <button class="menu-card" style="--card:var(--pink)" data-mode="unlimited"><span><strong>UNLIMITED</strong><small>Dive again with a fresh set of prompts</small></span><i>→</i></button>
    </div>`;
  }
  if (kind === 'stats') {
    const s = stats();
    const history = s.latest.length
      ? s.latest.map((h) => `<div><span>${h.mode === 'daily' ? 'Dive' : 'Game'} #${esc(h.key)}</span><b>${h.score} pts · ${(h.score * 10).toLocaleString('en-US')}m</b></div>`).join('')
      : '<div><span>No dives yet.</span><b>—</b></div>';

    </div>`;
  }
  if (kind === 'buddy') {
    const s = stats();
    const chosen = getBuddy();
    const cards = BUDDIES.map((b) => {
      const open = s.bestStreak >= b.streak;
      return `<button class="buddy ${open ? 'on' : ''} ${b.id === chosen ? 'chosen' : ''}" data-buddy="${b.id}" ${open ? '' : 'disabled'}>
        <img src="${b.src}" alt="" width="46" height="46"><small>${esc(b.name)}</small><em>${b.streak === 0 ? 'starter' : open ? 'unlocked' : `${b.streak}-day streak`}</em>
      </button>`;
    }).join('');
    return `<div class="panel-inner">${head('DIVE BUDDY')}
      <p class="guide">Your buddy rides along on every descent. Long daily streaks unlock the rest of the shoal.</p>
      <div class="buddies">${cards}</div>
      <p class="reset-note">Unlocked with a ${s.bestStreak}-day best streak.</p>
    </div>`;
  }
  if (kind === 'achievements') {
    const list = achievements().map((a) => `<div class="${a.got ? 'got' : ''}"><span><strong>${esc(a.name)}</strong><small>${esc(a.text)}</small></span><i>${a.got ? 'unlocked' : `${a.value} / ${a.goal}`}</i></div>`).join('');
    return `<div class="panel-inner">${head('ACHIEVEMENTS')}<div class="ach">${list}</div></div>`;
  }
  if (kind === 'settings') {
    const row = (key, title, text) => `<div class="setting"><span><strong>${title}</strong><small>${text}</small></span><button class="switch" role="switch" aria-checked="${settings[key] ? 'true' : 'false'}" data-toggle="${key}" aria-label="${title}"></button></div>`;
    return `<div class="panel-inner">${head('SETTINGS')}
      ${row('sound', 'Sound', 'Synthesised cues, built in the browser.')}

      ${row('clearRejected', 'Clear rejected entries', 'Empty the box after an answer is refused.')}
      ${row('lowPower', 'Low power mode', 'Fewer particles and a lighter ocean.')}
      ${row('colorblind', 'Colourblind mode', 'Higher contrast tier colours and HUD.')}

  if (kind === 'guide') {
    return `<div class="panel-inner">${head('GUIDE')}
      <div class="guide">
        <p>Seven prompts, one answer each, twenty-five seconds per prompt. There is no list to pick from: you type what you know, and the rarer the answer, the deeper you sink.</p>
        <h3>Reading the prompt</h3>
        <p>Most misses are wording, not knowledge. A prompt can carry a condition — exactly four letters, only above the waist, no tabletop games. Every condition counts.</p>
        <h3>How an answer is scored</h3>
        <p>Each prompt ships with one checked list of answers. Your text is normalised (accents, capitals, punctuation and spacing do not matter), aliases and singular/plural forms are recognised, and a slipped letter, a swapped pair or a missing one is offered back as a correction before it scores. Typing only the opening of a longer answer ("bosnia", "epony") fills in the full name for you to confirm.</p>
        <ul>
          <li>Plankton — 10 points. The answer everyone blurts out.</li>
          <li>Too Clever — 15. The obscure answer the whole room also thought of.</li>
          <li>Schooler — 30. Solid.</li>
          <li>Rare — 60. An uncommon pull.</li>
          <li>Deep Cut — 85. True obscurity.</li>
          <li>One in a Krillion — 100. The gem.</li>
        </ul>
        <p>Every point is ten metres, and the camera follows your answer down. Seven gems is 700 points and 7,000 metres.</p>
        <h3>When time runs out</h3>
        <p>Text in the box is submitted at the buzzer. An empty box scores nothing. A refused answer can be retried while the clock is still running.</p>
        <h3>Daily and Unlimited</h3>
        <p>Both modes live on this one page. Daily is the same seven prompts for everyone; Unlimited deals a fresh set and keeps its own number, so a link replays that exact dive.</p>
        <h3>Offline habits</h3>
        <p>This page works straight from a file. Settings, streaks, buddies and history are stored in this browser; clearing site data erases them.</p>

    </div>`;
  }
  return `<div class="panel-inner">${head('ABOUT')}
    <div class="guide">
      <p>An independent, browser-only recreation of the Krillion dive: daily and unlimited sets, six rarity tiers, typo correction, the pixel ocean, the sounds and the score report.</p>
      <p>This build is a single static page. There is no server, no answer checker beyond the bundled lists, and no population statistics. Answers that are not on a prompt's list are refused even if they are true.</p>
      <p>Prompt data is embedded, and when the page is served over HTTP it also reads <b>daily/game_N.json</b> and <b>unlimited/unlimited_N.json</b>. Drop your own files in those folders to change the dive; the README documents the shape.</p>
      <p>Not affiliated with krillion.io or krillion.game. Pixel art and the VT323 typeface are vendored from the public reference build; scenery is drawn procedurally in the browser.</p>
    </div>
  </div>`;
}

function wireEvents() {
  $('#start-btn').addEventListener('click', () => (revisitResult ? reopenDaily() : startDive()));
  $('#answer-form').addEventListener('submit', onSubmit);
  $('#next-btn').addEventListener('click', onNext);
  $('#menu-btn').addEventListener('click', () => openPanel('menu'));
  $('#mute-btn').addEventListener('click', () => {
    saveSetting('sound', !settings.sound);
    if (settings.sound) sound.ensure();
    toast(settings.sound ? 'sound on' : 'sound off');
  });
  $('#mascot').addEventListener('click', () => {
    sound.poke();
    const word = $('#mascot-word');
    word.textContent = ['blub!', 'hello?', 'deeper!', 'again?'][Math.floor(Math.random() * 4)];
    $('#mascot').classList.add('poked');
    setTimeout(() => $('#mascot').classList.remove('poked'), 520);
  });

  const panel = $('#panel');
  panel.addEventListener('click', (event) => {
    if (event.target === panel || event.target.closest('[data-close]')) return panel.close();
    const opener = event.target.closest('[data-panel]');
    if (opener) {
      event.preventDefault();
      return openPanel(opener.dataset.panel);
    }
    const toggle = event.target.closest('[data-toggle]');
    if (toggle) {
      const key = toggle.dataset.toggle;
      saveSetting(key, !settings[key]);
      toggle.setAttribute('aria-checked', String(!!settings[key]));
      if (key === 'sound' && settings.sound) sound.ensure();
      return;
    }
    const buddy = event.target.closest('[data-buddy]');
    if (buddy) {
      setBuddy(buddy.dataset.buddy);
      return openPanel('buddy');
    }
    const action = event.target.closest('[data-action]');
    if (action) return handleAction(action.dataset.action);
  });
  panel.addEventListener('close', () => dive?.resume());

  $('#results').addEventListener('click', (event) => {
    const action = event.target.closest('[data-action]');
    if (!action) return;
    event.preventDefault();
    handleAction(action.dataset.action);
  });

  document.addEventListener('click', (event) => {
    const target = event.target.closest('button[data-mode]');
    if (!target) return;
    event.preventDefault();
    const dialog = $('#panel');
    if (dialog.open) dialog.close();
    switchMode(target.dataset.mode);
  });

  document.addEventListener('visibilitychange', () => {
    if (!dive) return;
    if (document.hidden) {
      dive.pause();
      sound.suspend();
    } else {
      dive.resume();
    }
  });

  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  reduced.addEventListener?.('change', () => scene.setReduced(reduced.matches));
  window.addEventListener('resize', layoutRuler);

  setInterval(() => {
    if (!scene) return;
    // An occluded tab stops requestAnimationFrame; keep the HUD honest anyway.
    if (scene.stalled()) scene.setDepth(scene.target, true);
    updateHud();
  }, 160);
}

function handleAction(action) {
  if (action === 'copy') return copyResult();
  if (action === 'share') {
    if (!dive) return;
    const text = shareLineFor(dive);
    if (navigator.share) return navigator.share({ title: 'Krillion', text }).catch(() => {});
    return copyResult();
  }
  if (action === 'another') return anotherDive();
  if (action === 'mode-unlimited') return switchMode('unlimited');
  if (action === 'mode-daily') return switchMode('daily');
  if (action === 'replay') {
    const first = $('.review details');
    if (first) {
      first.open = true;
      first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    return;
  }
  if (action === 'menu') return openPanel('menu');
  if (action === 'clear') {
    if (!confirm('Clear every saved dive, streak and buddy?')) return;
    clearHistory();
    revisitResult = null;
    $('#start-btn').textContent = '▼ BEGIN DESCENT ▼';
    return openPanel('stats');
  }
  if (action === 'export') {
    const blob = new Blob([JSON.stringify(getHistory(), null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'krillion-history.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
}

function toast(message) {
  const el = $('#toast');
  el.hidden = false;
  el.textContent = message;
  clearTimeout(toast.id);
  toast.id = setTimeout(() => {
    el.hidden = true;
  }, 2200);
}

/* A completed daily dive reopens its report instead of replaying. */
function reopenDaily() {
  if (!game || !revisitResult) return startDive();
  dive = new Dive({ prompts: game.prompts, settings });
  dive.index = Math.max(0, revisitResult.results.length - 1);
  dive.results = revisitResult.results;
  dive.score = revisitResult.score;
  dive.phase = 'done';
  $('#intro').inert = true;
  $('#hero').inert = true;
  showResults(true);
}

})();</script>
