:root {
  --ink: #050a14;
  --deep: #071322;
  --foam: #e8f1ff;
  --muted: #7d93b8;
  --cyan: #4de3ff;
  --pink: #ff5d8f;
  --gold: #ffd166;
  --tier: #4de3ff;
  --time: 1;
  --urgency: 0;
  --stage-rail: 0px;
  --vh: 100dvh;
  /* The depth the camera pins to: the chip, the tier lines and the YOU
     marker all share it, so an answer lands on its own rarity line. */
  --dive-line: 38%;
  color-scheme: dark;
  font-family: VT323, ui-monospace, monospace;
  font-size: 20px;
  background: var(--ink);
  color: var(--foam);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { overflow: hidden; overscroll-behavior: none; }
button, input, select, textarea { font: inherit; }
button, a, input, summary, dialog { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button { cursor: pointer; color: inherit; }
button:disabled { cursor: default; opacity: .45; }
a { color: inherit; text-underline-offset: 4px; }
h1, h2, h3, p { margin: 0; }
ul { margin: 0; padding: 0; }
[hidden] { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 5px; }

#game {
  position: fixed;
  inset: 0;
  height: var(--vh);
  overflow: hidden;
  isolation: isolate;
  background: #050a14;
}
#ocean { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }

.crt {
  position: absolute; inset: 0; z-index: 30; pointer-events: none; opacity: .45;
  background: repeating-linear-gradient(0deg, #0000002e 0 1px, transparent 1px 3px);
}
.vignette {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: radial-gradient(ellipse at 50% 40%, transparent 50%, #02040a66 100%);
}
.danger-glow {
  position: absolute; inset: 0; pointer-events: none; z-index: 25;
  box-shadow: inset 0 0 90px 18px #ff5d8f99;
  opacity: var(--urgency);
  transition: opacity .4s linear;
}
.flash { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0; background: var(--gold); }
.flash.on { animation: flash .6s ease-out; }
@keyframes flash { 0% { opacity: .5; } 100% { opacity: 0; } }

body[data-lowpower="true"] .crt { opacity: .18; }
body[data-lowpower="true"] .vignette { opacity: .5; }
body[data-colorblind="true"] { --cyan: #6ff2ff; --pink: #ff8a5c; }
body[data-colorblind="true"] .hud-pod strong { text-shadow: 0 0 0 transparent; }

/* ---------- chrome buttons ---------- */
.square {
  padding: 2px; background: #102239c7; border: 2px solid #061729; color: var(--muted);
  height: 30px; width: 38px; font-size: 26px; line-height: 20px;
  box-shadow: inset 0 0 0 1px #8194a33d;
  display: grid; place-items: center; border-radius: 0;
}
.square:hover { color: var(--cyan); background: #142e48; }
.square svg { width: 20px; height: 20px; display: block; }
.utility .square { width: 34px; height: 26px; border: 0; box-shadow: 0 0 0 2px #060d1ae6; opacity: .85; }
.menu-btn { position: absolute; top: 15px; left: calc(var(--stage-rail) + 10px); z-index: 35; }
.utility { position: absolute; top: 15px; right: calc(var(--stage-rail) + 10px); z-index: 35; display: flex; flex-direction: column; gap: 6px; }
body:not([data-phase="intro"]) .menu-btn,
body:not([data-phase="intro"]) .utility { top: 82px; }
body[data-phase="results"] .menu-btn,
body[data-phase="results"] .utility { opacity: 0; pointer-events: none; }
.menu-btn, .utility { transition: opacity .2s ease; }

/* ---------- hero ---------- */
.hero {
  position: absolute; z-index: 3; top: 17.8%; left: 12px; right: 12px;
  text-align: center; pointer-events: none;
  transition: opacity .45s ease, transform .6s ease, visibility 0s;
}
body:not([data-phase="intro"]) .hero {
  opacity: 0; transform: translateY(-26px); visibility: hidden;
  transition: opacity .45s ease, transform .6s ease, visibility 0s .45s;
}
.hero h1 { margin: 0; font-weight: 400; line-height: .88; }
.open-label { display: block; color: #3c92ae; font-size: 12px; letter-spacing: .45em; margin-bottom: 12px; opacity: .7; }
.hero-word {
  display: block; font-size: clamp(42px, 10vw, 124px); letter-spacing: .02em;
  text-shadow: -4px 3px #ff5d8f, 4px -3px #4de3ffd9, 0 0 30px #4de3ff59;
  animation: glitch 7s steps(1) infinite;
}
.hero-word span { display: inline-block; animation: drift 4.6s ease-in-out infinite; animation-delay: calc(var(--letter) * .12s); }
@keyframes drift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes glitch {
  0%, 94%, 98%, 100% { transform: none; }
  95% { transform: translateX(1px); }
  96% { text-shadow: -6px 2px #ff5d8f, 4px -3px #4de3ff; }
  97% { transform: translateX(-1px); }
}
.tagline {
  font-size: clamp(19px, 2.4vw, 28px); letter-spacing: .35em; color: #4fd6ea;
  margin: 30px 0 18px; text-shadow: 1px 2px #1c587c44, 0 0 18px #050a14cc;
}
.subline { font-size: clamp(15px, 1.8vw, 20px); letter-spacing: .08em; color: #93a9c3; margin: 18px auto 0; max-width: 95%; line-height: 1.5; text-shadow: 0 1px 3px #050a14cc; }
.mode-switch { display: flex; gap: 24px; justify-content: center; margin-top: 26px; pointer-events: auto; }
.mode-switch button {
  background: #061422cc; border: 0; border-radius: 0;
  box-shadow: inset 0 0 0 1px #24455d, 0 3px 0 #030a12;
  font-size: 20px; letter-spacing: .12em; color: #9db4cd;
  padding: 7px 14px;
}
.mode-switch button:hover { color: var(--foam); background: #0c2133e6; }
.mode-switch button:active { transform: translateY(2px); box-shadow: inset 0 0 0 1px #4de3ff44, 0 1px 0 #030a12; }
.mode-switch button[aria-current="page"] { color: var(--cyan); box-shadow: inset 0 0 0 1px #4de3ff77, 0 3px 0 #030a12; }

/* ---------- hud ---------- */
.hud {
  position: absolute; z-index: 6; left: 0; right: 0; top: 8px;
  max-width: 720px; margin: 0 auto; padding: 0 12px;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  transform: translateY(-80px); opacity: 0; pointer-events: none;
  transition: transform .6s cubic-bezier(.2, 1.4, .4, 1), opacity .5s;
}
body:is([data-phase="preview"], [data-phase="answer"], [data-phase="plunge"], [data-phase="landing"]) .hud { transform: none; opacity: 1; }
.hud-pod {
  min-width: 120px; padding: 6px 14px 8px; border-radius: 10px;
  background: linear-gradient(#101d33eb, #0b1526eb);
  box-shadow: 0 0 0 2px #060d1a, 0 0 0 4px #1b3050, inset 0 2px #e8f1ff0f;
}
.hud-pod > span { display: block; font-size: 12px; line-height: 1.5; letter-spacing: .35em; color: var(--muted); }
.hud-pod strong { display: block; font-size: 32px; line-height: 1; font-weight: 400; color: var(--cyan); text-shadow: 0 0 10px #4de3ff55; font-variant-numeric: tabular-nums; }
.hud-pod:last-child { text-align: right; }
.hud-pod:last-child strong { color: var(--pink); text-shadow: 0 0 10px #ff5d8f55; }
.round-progress { text-align: center; padding-top: 6px; flex: 1; min-width: 0; }
#round-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 5px; }
#round-dots i { width: 10px; height: 10px; background: #102239; box-shadow: 0 0 0 2px #060d1a; display: block; }
#round-dots i.active { background: var(--pink); box-shadow: 0 0 0 1px #ff5d8f88, 0 0 10px #ff5d8f66; animation: current-prompt 1.4s ease-in-out infinite; }
#round-dots i.done { background: var(--gold); box-shadow: inset 0 0 0 1px #fff0c2, 0 0 8px #ffd16666; }
@keyframes current-prompt { 0%, 100% { transform: scale(1.05); } 50% { transform: scale(1.35); } }
#round-label { font-size: 11px; letter-spacing: .3em; color: var(--muted); }

/* ---------- mascot ---------- */
.mascot {
  position: absolute; z-index: 4; right: 22px; bottom: 23%;
}
.mascot {
  position: absolute; z-index: 4; right: 22px; bottom: 23%;
  background: none; border: 0; padding: 0; display: grid; place-items: center; gap: 2px;
  filter: drop-shadow(0 6px 12px #02060ecc);
}
body:is([data-phase="preview"], [data-phase="answer"], [data-phase="plunge"], [data-phase="landing"]) .mascot {
  left: 22px; right: auto;
}
.mascot img { width: 56px; height: 56px; image-rendering: pixelated; animation: companion-swim 2.6s cubic-bezier(.37, 0, .63, 1) infinite; }
.mascot span { font-size: 15px; color: #9ec3dd; opacity: .75; letter-spacing: .1em; }
.mascot:hover span, .mascot:focus-visible span { opacity: 1; color: var(--cyan); }
.mascot.poked img { animation: companion-roll .9s cubic-bezier(.3, .1, .3, 1); }
@keyframes companion-swim {
  0%, 100% { transform: translateY(0) rotate(-4deg); }
  25% { transform: translateY(-7px) rotate(2deg) scaleX(.96); }
  50% { transform: translateY(-2px) rotate(5deg); }
  75% { transform: translateY(-9px) rotate(-2deg) scaleX(.97); }
}
@keyframes companion-roll { to { transform: rotate(720deg); } }

/* ---------- prompt + landing ---------- */
.pixel-frame {
  background: #101d33ed;
  box-shadow: 0 0 0 3px #4de3ff40, 0 0 50px #0009, inset 0 0 34px #050a1499;
}
.prompt-card {
  position: absolute; z-index: 8; top: calc(var(--vh) * .206);
  left: calc(50% - 264px); width: 480px; padding: 22px 26px 20px;
  border-radius: 16px; background: #0c1a2b; box-shadow: 0 22px 55px #000b;
  overflow: hidden;
  animation: question-arrive .7s cubic-bezier(.2, 1.5, .4, 1) .45s backwards;
}
.prompt-card::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .06;
  background: repeating-linear-gradient(0deg, transparent 0 2px, #e8f1ff 2px 3px);
}
@keyframes question-arrive { from { opacity: 0; transform: translateY(46px) scale(.92); } to { opacity: 1; transform: none; } }
.eyebrow { font-size: 15px; letter-spacing: .3em; color: var(--cyan); }
.prompt-card .eyebrow { margin: 0; font-size: 16px; line-height: 1.5; letter-spacing: .32em; color: #ff7d9d; }
.prompt-card h2 { font-weight: 400; line-height: 1.02; font-size: 40px; margin: 6px 0 8px; color: var(--foam); text-shadow: 0 0 16px #e8f1ff40, 2px 0 #ff5d8f2e, -2px 0 #4de3ff2e; }
.prompt-card .hint { margin: 0; font-size: 15px; line-height: 1.5; letter-spacing: .16em; color: #6d88a8; }

.landing {
  position: absolute; z-index: 12; top: 32%; left: 16px; right: 16px;
  max-width: 600px; margin: 0 auto; padding: 0; text-align: center;
  background: transparent; box-shadow: none; border: 0;
  animation: landing-arrive .8s cubic-bezier(.2, 1.7, .4, 1) backwards;
}
@keyframes landing-arrive { from { opacity: 0; transform: scale(.5); } }
.landing .eyebrow {
  color: var(--tier); letter-spacing: .2em; font-size: 44px; line-height: 1.25;
  text-shadow: 0 0 14px color-mix(in srgb, var(--tier) var(--glow, 43%), transparent), 0 0 28px color-mix(in srgb, var(--tier) var(--glow-soft, 19%), transparent);
}
.land-icon { width: 88px; height: 88px; image-rendering: pixelated; display: block; margin: 0 auto 8px; animation: icon-float 2.6s ease-in-out infinite; }
@keyframes icon-float { 50% { transform: translateY(-8px); } }
#land-answer { font-size: 34px; font-weight: 400; line-height: 1.35; letter-spacing: .06em; margin: 4px 0 0; color: #f2f7ff; overflow-wrap: anywhere; }
#land-points { font-size: 28px; color: var(--foam); letter-spacing: .06em; }
#land-quip { margin-top: 6px; font-size: 19px; letter-spacing: .12em; color: #9fb6cf; line-height: 1.5; }

/* ---------- intro ---------- */
.intro {
  position: absolute; z-index: 10; bottom: 11.6%; left: 20px; right: 20px;
  max-width: 600px; margin: auto; display: flex; flex-direction: column; gap: 10px;
  transition: opacity .35s ease, transform .5s ease, visibility 0s;
}
body:not([data-phase="intro"]) .intro {
  opacity: 0; transform: translateY(18px); pointer-events: none; visibility: hidden;
  transition: opacity .35s ease, transform .5s ease, visibility 0s .35s;
}
.how-to { font-size: 14px; color: var(--muted); letter-spacing: .18em; }
.how-to summary { cursor: pointer; list-style: none; font-size: 13px; line-height: 1.6; letter-spacing: .22em; }
.how-to summary::-webkit-details-marker { display: none; }
.how-to summary::before { content: '▸ '; }
.how-to[open] summary::before { content: '▾ '; }
.how-to ul { margin: 8px 0 10px; padding-left: 16px; display: grid; gap: 3px; }
.how-to li { list-style: none; position: relative; }
.how-to li::before { content: '·'; position: absolute; left: -12px; color: #3f6b8a; }
.begin-btn {
  width: 100%; padding: 13px 34px 11px; border-radius: 6px;
  background: #0d1d31; border: 0; color: var(--foam);
  font-size: 28px; line-height: 1.5; letter-spacing: .14em;
  box-shadow: 0 0 0 3px #050a14, 0 0 0 6px var(--cyan), 0 6px 0 6px #103048, 0 0 26px #4de3ff4d;
  transition: box-shadow .15s ease, color .15s ease;
}
.begin-btn:hover { color: var(--cyan); box-shadow: 0 0 0 3px #050a14, 0 0 0 5px var(--pink), 0 5px 0 5px #123048, 0 0 34px #ff5d8f8c; }
.intro-meta { display: flex; justify-content: center; gap: 12px; font-size: 14px; letter-spacing: .22em; color: #6c87a6; }
.sample-note { margin: 4px auto 0; max-width: 560px; text-align: center; font-size: 15px; line-height: 1.5; letter-spacing: .08em; color: var(--gold); opacity: .9; }
.error { margin-top: 4px; text-align: center; font-size: 15px; color: #ff9db6; }

/* ---------- answer dock ---------- */
.answer-dock {
  position: absolute; z-index: 14; bottom: calc(6% + 20px); left: 16px; right: 16px;
  max-width: 600px; margin: 0 auto;
  animation: dock-rise .55s cubic-bezier(.34, 1.56, .64, 1);
}
@keyframes dock-rise { from { opacity: 0; transform: translateY(120px); } }
.answer-dock::before {
  content: ''; position: absolute; inset: -30px -100vw -100px; z-index: -1; pointer-events: none;
  background: linear-gradient(transparent, #050a14e8 42%, #050a14f2);
}
#answer-form { display: flex; align-items: center; gap: 10px; }
.timer {
  position: relative; flex: none; width: 58px; height: 58px;
  display: grid; place-items: center; font-size: 26px; color: var(--cyan);
  border-radius: 50%; overflow: hidden;
  box-shadow: 0 0 0 2px #081322, 0 0 0 4px #1b3050, 0 0 18px #4de3ff33, inset 0 0 14px #4de3ff24;
  font-variant-numeric: tabular-nums;
}
.timer::before {
  content: ''; position: absolute; inset: 8px; border: 1px solid #4de3ff38; border-radius: 50%; z-index: 0;
  background: linear-gradient(transparent calc(50% - .5px), #4de3ff18 50%, transparent calc(50% + .5px)), linear-gradient(90deg, transparent calc(50% - .5px), #4de3ff18 50%, transparent calc(50% + .5px));
}
.timer svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.timer circle { fill: none; stroke: #4de3ff33; stroke-width: 1; }
.timer .timer-ring {
  stroke: var(--cyan); stroke-width: 2; stroke-dasharray: 157;
  stroke-dashoffset: calc(157 * (1 - var(--time)));
  transition: stroke-dashoffset .12s linear;
}
.timer span { z-index: 1; }
body.timer-hot .timer { color: var(--pink); }
body.timer-hot .timer .timer-ring { stroke: var(--pink); }
body.timer-hot { --urgency: calc(.35 + .35 * var(--pulse, 0)); }

.input-wrap { position: relative; flex: 1; min-width: 0; }
#answer {
  width: 100%; height: 59px; padding: 9px 10px 7px;
  background: #071322; color: var(--foam);
  border: 2px solid #2b5670; border-radius: 0;
  font-size: 26px; letter-spacing: .01em; caret-color: var(--pink);
}
#answer::placeholder { color: #4f6d8b; }
#answer:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 18px #4de3ff33; }
body.timer-hot #answer { border-color: #ff5d8faa; }
.time-bar { position: absolute; left: 0; right: 0; bottom: -8px; height: 4px; background: #0d2236; overflow: hidden; box-shadow: 0 0 0 2px #060d1a; }
.time-bar i { display: block; height: 100%; width: calc(var(--time) * 100%); background: var(--cyan); transition: width .12s linear; }
body.timer-hot .time-bar i { background: var(--pink); }
#submit-btn {
  flex: none; width: 76px; height: 54px; padding: 11px 16px 9px;
  background: var(--pink); color: #11182d; border: 0;
  box-shadow: 0 0 0 2px #050a14, 0 0 16px #ff5d8f66, 0 4px 0 2px #431729;
  font-size: 21px; letter-spacing: .12em;
}
#submit-btn:hover { background: #ff7295; box-shadow: 0 0 0 2px #050a14, 0 0 26px #ff5d8f99, 0 4px 0 2px #431729; }
#submit-btn:active { transform: translateY(2px); box-shadow: 0 0 0 2px #050a14, 0 0 16px #ff5d8f66, 0 2px 0 2px #431729; }
#submit-btn:disabled { opacity: .55; }

.answer-status {
  min-height: 26px; margin: 0 0 8px; font-size: 18px; line-height: 1.3;
  color: var(--pink); text-align: center; background: #050a14d9; padding: 2px 8px;
}
.answer-status:empty { display: none; }
.answer-status.correction {
  color: var(--gold); border: 1px solid #ffd16655; padding: 9px 10px;
  display: grid; gap: 2px; justify-items: center;
}
.answer-status.correction small { font-size: 13px; color: var(--muted); letter-spacing: .06em; }
.answer-status b { font-weight: 400; color: #fff3cf; }

.preview-label {
  position: absolute; z-index: 12; left: 50%; bottom: 12%; transform: translateX(-50%);
  padding: 0; font-size: 16px; letter-spacing: .16em; color: #93a9c3; text-align: center;
  background: none; box-shadow: none;
  max-width: calc(100vw - 32px);
}
.preview-label b { color: var(--cyan); font-weight: 400; }

.next-wrap { position: absolute; z-index: 15; left: 16px; right: 16px; bottom: 7%; display: flex; justify-content: center; animation: dock-rise .5s cubic-bezier(.34, 1.56, .64, 1); }
.next-btn {
  background: #0d1d31; border: 0; border-radius: 6px; padding: 12px 30px 10px; font-size: 22px; line-height: 1.5; letter-spacing: .14em; color: var(--foam);
  box-shadow: 0 0 0 3px #050a14, 0 0 0 6px var(--cyan), 0 6px 0 6px #103048, 0 0 26px #4de3ff44;
}
.next-btn:hover { color: var(--cyan); box-shadow: 0 0 0 3px #050a14, 0 0 0 6px var(--pink), 0 6px 0 6px #103048, 0 0 34px #ff5d8f6b; }
.next-btn:active { transform: translateY(3px); box-shadow: 0 0 0 3px #050a14, 0 0 0 6px var(--cyan), 0 3px 0 6px #103048; }

/* ---------- results ---------- */
.results {
  position: absolute; inset: 0; z-index: 22; overflow-y: auto; overscroll-behavior: contain;
  padding: 40px 16px 64px;
  background: radial-gradient(ellipse at 50% 0%, #0a1a2bfc 0%, #050a14fe 55%, #050a14 100%);
  animation: fade-in .5s ease;
  scrollbar-color: #2d4a68 #050a14;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.result-shell { max-width: 448px; margin: 0 auto; }
.result-brand { display: block; font-size: 27px; letter-spacing: .08em; color: var(--pink); text-align: center; margin-bottom: 10px; text-shadow: -3px 2px #ff5d8f55, 3px -2px #4de3ff59; }
.result-kicker { text-align: center; font-size: 13px; letter-spacing: .34em; color: var(--muted); }
.results h1 { text-align: center; font-size: clamp(34px, 6vw, 46px); font-weight: 400; letter-spacing: .06em; margin: 8px 0 4px; color: var(--foam); text-shadow: -3px 2px #ff5d8f66, 3px -2px #4de3ff59; }
.result-depth { text-align: center; font-size: 80px; line-height: .95; color: var(--cyan); text-shadow: 3px 3px #10394b; font-variant-numeric: tabular-nums; margin: 6px 0 0; }
.result-depth span { font-size: 30px; letter-spacing: .1em; }
.result-points { text-align: center; font-size: 22px; color: var(--foam); margin-top: 6px; font-variant-numeric: tabular-nums; }
.result-points b { font-weight: 400; color: var(--pink); font-size: 27px; }
.result-band { text-align: center; margin: 14px auto 4px; font-size: 18px; letter-spacing: .1em; color: var(--tier); }
.result-band img { width: 18px; height: 18px; image-rendering: pixelated; vertical-align: -3px; }
.result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 16px 0 22px; }
.btn {
  display: inline-block; text-align: center; text-decoration: none;
  background: #102239; border: 2px solid #2b4566; color: var(--foam);
  padding: 9px 18px; font-size: 19px; letter-spacing: .08em; border-radius: 0;
  box-shadow: 0 3px 0 #060f1c;
}
.btn:hover { border-color: var(--cyan); color: var(--cyan); }
.btn.gold { border-color: #ffd166aa; color: #ffe7b0; }
.btn.ghost { border-color: #22384f; color: var(--muted); }

.rule { margin: 26px 0 12px; font-size: 12px; letter-spacing: .3em; color: #5d789a; display: flex; align-items: center; gap: 10px; }
.rule::after { content: ''; height: 1px; flex: 1; background: linear-gradient(90deg, #24405c, transparent); }

.dive-chart { position: relative; height: 210px; margin: 6px 0 4px; }
.chart-grid { position: absolute; left: 0; right: 0; height: 1px; background: #1b3149; }
.chart-grid span { position: absolute; left: 0; top: -9px; font-size: 11px; color: #4d6683; background: #071322; padding-right: 4px; }
.dive-columns { position: absolute; inset: 0 0 22px; display: grid; grid-template-columns: repeat(7, 1fr); align-items: end; }
.dive-column { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
.dive-dot { position: absolute; left: 50%; top: var(--drop); transform: translate(-50%, -50%); display: grid; place-items: center; }
.dive-dot img { width: 26px; height: 26px; image-rendering: pixelated; }
.dive-stem { position: absolute; left: 50%; top: 0; width: 2px; height: var(--drop); background: linear-gradient(#4de3ff55, #4de3ff11); }
.dive-column small { position: absolute; bottom: -20px; font-size: 12px; color: #4d6683; }

.band-list { list-style: none; display: grid; gap: 6px; margin: 0 0 8px; }
.band-list li { display: grid; grid-template-columns: 26px 64px 1fr; gap: 8px; align-items: baseline; font-size: 15px; color: #6c87a6; padding: 5px 8px; }
.band-list li img { width: 20px; height: 20px; image-rendering: pixelated; }
.band-list li.current { background: #0e2237; box-shadow: inset 0 0 0 1px #2a4a67; color: var(--foam); }
.band-range { font-variant-numeric: tabular-nums; }

.review { display: grid; gap: 8px; }
.review details { background: #081525; box-shadow: inset 0 0 0 1px #1d334b; border-left: 3px solid var(--tier, #21384f); }
.review summary { cursor: pointer; list-style: none; padding: 12px 14px; display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; }
.review summary::-webkit-details-marker { display: none; }
.review summary:hover { background: #0d2032; }
.review .n { font-size: 13px; color: #4d6683; }
.review .q { font-size: 17px; line-height: 1.25; }
.review .q small { display: block; font-size: 14px; color: var(--muted); margin-top: 3px; }
.review .pts { font-size: 19px; color: var(--tier); text-align: right; font-variant-numeric: tabular-nums; }
.review .pts small { display: block; font-size: 12px; color: color-mix(in srgb, var(--tier) 65%, #ffffff); }
.review .body { padding: 0 14px 12px 54px; font-size: 15px; color: var(--muted); line-height: 1.45; }
.review .body img { width: 18px; height: 18px; vertical-align: -3px; image-rendering: pixelated; margin-right: 6px; }
.answer-head { margin: 12px 0 4px; font-size: 11px; letter-spacing: .24em; color: #5d789a; }
.answer-list { max-height: 260px; overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
.answer-row {
  display: grid; grid-template-columns: 16px 20px minmax(0, 1fr) auto auto;
  align-items: center; gap: 8px; padding: 5px 2px;
  border-bottom: 1px solid #12283c; font-size: 15px;
}
.answer-rank { font-size: 12px; color: #4d6683; font-variant-numeric: tabular-nums; }
.answer-icon img { width: 18px; height: 18px; display: block; image-rendering: pixelated; opacity: .95; }
.answer-name { color: var(--row); overflow-wrap: anywhere; }
.answer-name em {
  font-style: normal; margin-left: 7px; padding: 0 4px;
  font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  border: 1px solid var(--row); color: var(--row); opacity: .85; white-space: nowrap;
}
.answer-tier { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--row); opacity: .8; white-space: nowrap; }
.answer-pts { color: var(--row); font-variant-numeric: tabular-nums; white-space: nowrap; }
.answer-row.mine { background: #0f25376b; }
.answer-row.mine .answer-name { text-shadow: 0 0 12px color-mix(in srgb, var(--row) 55%, transparent); }
.dist-note { font-size: 13px; color: #58748f; text-align: center; margin-top: 4px; }
.reset-note { text-align: center; font-size: 14px; color: #58748f; margin-top: 18px; letter-spacing: .06em; }
.result-foot { text-align: center; margin-top: 26px; font-size: 13px; color: #48627e; line-height: 1.6; }
.result-foot a { color: #6e93b4; }

/* ---------- dialogs ---------- */
.panel {
  color: var(--foam); background: #0b1727; border: 2px solid #2a486a;
  padding: 0; max-width: 620px; width: calc(100% - 32px); max-height: 86vh;
  box-shadow: 0 24px 60px #000a, 0 0 0 1px #050a14;
  border-radius: 0;
}
.panel::backdrop { background: #000a14cc; backdrop-filter: blur(2px); }
.panel-inner { padding: 22px 22px 26px; max-height: 86vh; overflow-y: auto; overscroll-behavior: contain; scrollbar-color: #2d4a68 #0b1727; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.panel-head h2 { font-size: 30px; font-weight: 400; letter-spacing: .16em; color: var(--cyan); }
.menu-kicker { font-size: 11px; letter-spacing: .4em; color: #4a6a8c; }
.close { background: none; border: 1px solid #2b4566; color: var(--muted); padding: 4px 10px; font-size: 16px; }
.close:hover { color: var(--pink); border-color: var(--pink); }
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 18px; }
.menu-grid button {
  display: flex; align-items: center; gap: 10px; text-align: left;
  background: #0f2033; border: 1px solid #21384f; color: var(--foam);
  padding: 11px 12px; font-size: 18px;
}
.menu-grid button:hover { border-color: var(--cyan); color: var(--cyan); background: #132a42; }
.menu-grid button[aria-current="page"] { border-color: #3f6f8f; color: var(--cyan); }
.menu-grid svg { width: 22px; height: 22px; flex: none; color: #5d8bab; }
.menu-grid .menu-symbol { width: 22px; text-align: center; font-size: 22px; line-height: 1; color: #5d8bab; }
.menu-card {
  display: flex; align-items: center; gap: 10px; text-decoration: none;
  width: 100%; text-align: left; font: inherit; cursor: pointer;
  border: 1px solid #22384f; border-left: 3px solid var(--card, #2b4566);
  background: #0c1a2b; padding: 10px 12px; margin-bottom: 6px;
}
.menu-card:hover { background: #112539; }
.menu-card span { display: grid; flex: 1; }
.menu-card strong { font-weight: 400; font-size: 16px; letter-spacing: .12em; color: var(--foam); }
.menu-card small { color: var(--muted); font-size: 14px; }
.menu-card i { color: #48627e; font-style: normal; }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 18px; }
.stat { background: #0d1d2f; border: 1px solid #22384f; padding: 10px 12px; }
.stat span { display: block; font-size: 11px; letter-spacing: .28em; color: #58748f; margin-bottom: 2px; }
.stat strong { font-size: 28px; font-weight: 400; color: var(--cyan); font-variant-numeric: tabular-nums; }
.history { display: grid; gap: 4px; margin-top: 8px; }
.history div { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; color: #8aa6c2; padding: 5px 0; border-bottom: 1px solid #142a3f; }
.history b { font-weight: 400; color: var(--pink); }

.buddies { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.buddy { background: #0d1d2f; border: 1px solid #22384f; padding: 10px 4px; display: grid; place-items: center; gap: 4px; color: var(--muted); }
.buddy img { width: 46px; height: 46px; image-rendering: pixelated; filter: grayscale(1) brightness(.65); }
.buddy.on { border-color: #2f5a7c; color: var(--foam); }
.buddy.on img { filter: none; }
.buddy.chosen { border-color: var(--cyan); box-shadow: 0 0 0 1px #4de3ff55; }
.buddy small { font-size: 12px; text-align: center; line-height: 1.2; }
.buddy em { font-style: normal; font-size: 11px; color: #4f6d8b; }

.ach { display: grid; gap: 7px; margin-top: 10px; }
.ach div { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 9px 11px; background: #0d1d2f; border-left: 3px solid #2a4560; }
.ach div.got { border-left-color: var(--gold); }
.ach strong { display: block; font-weight: 400; font-size: 17px; color: var(--foam); }
.ach small { color: var(--muted); font-size: 14px; }
.ach i { align-self: center; font-style: normal; font-size: 13px; color: #5c7896; }

.setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid #16293d; }
.setting span { display: grid; gap: 1px; }
.setting strong { font-weight: 400; font-size: 18px; color: var(--foam); }
.setting small { color: var(--muted); font-size: 14px; }
.switch { flex: none; width: 54px; height: 28px; background: #0a1725; border: 1px solid #27405c; position: relative; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: #3d5a76; transition: transform .15s, background .15s; }
.switch[aria-checked="true"] { background: #103048; border-color: #3f82a3; }
.switch[aria-checked="true"]::after { transform: translateX(26px); background: var(--cyan); }

.guide { font-size: 16px; line-height: 1.55; color: #a8c0d8; }
.guide h3 { font-size: 21px; font-weight: 400; color: var(--foam); margin: 18px 0 6px; letter-spacing: .04em; }
.guide p { margin: 0 0 9px; }
.guide ul { margin: 0 0 10px; padding-left: 18px; color: #96b0c9; }
.guide li { margin-bottom: 4px; }
.guide b { font-weight: 400; color: var(--cyan); }

.toast {
  position: fixed; z-index: 60; left: 50%; bottom: 28px; transform: translateX(-50%);
  padding: 10px 18px; background: #12263a; border: 1px solid #3f7b93; color: #dff2ff;
  font-size: 17px; box-shadow: 0 8px 26px #0008; max-width: 88vw;
  animation: toast-in .2s ease;
}
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ---------- depth notes + ruler ---------- */
.depth-notes { position: absolute; z-index: 4; left: 20px; top: 30%; display: grid; gap: 12px; pointer-events: none; text-align: left; }
.depth-note { font-size: 12px; letter-spacing: .14em; color: #7d9ab5; opacity: 0; transition: opacity .5s ease; text-shadow: 0 1px 0 #02060c; }
.depth-note::before { content: '— '; color: #3f6b8a; }

/* ---- src/rules.mjs ---- */
/* Scoring, rarity and answer-matching rules.
   Values follow krillion.game (rules.mjs) so a dive scores identically. */
const TIERS = {
  plankton: { name: 'Plankton', score: 10, emoji: '🫧', color: '#8fa3c4', blurb: 'The answer everyone blurts out.' },
  tooclever: { name: 'Too Clever', score: 15, emoji: '🤡', color: '#ff9f43', blurb: 'The obscure answer the whole school thought of.' },
  schooler: { name: 'Schooler', score: 30, emoji: '🐟', color: '#4de3ff', blurb: 'Solid — swims with the school.' },
  rare: { name: 'Rare', score: 60, emoji: '🦑', color: '#ff5252', blurb: 'An uncommon answer. Nice pull.' },
  deepcut: { name: 'Deep Cut', score: 85, emoji: '🏮', color: '#9d7bff', blurb: 'True obscurity. Few go this deep.' },
  krillion: { name: 'One in a Krillion', score: 100, emoji: '🌟', color: '#ffd166', blurb: 'The designated gem. Trench floor.' },
};

const BANDS = [
  { min: 0, max: 150, tier: 'plankton', name: 'Plankton', text: 'Plenty of ocean left down there.' },
  { min: 151, max: 250, tier: 'schooler', name: 'Schooler', text: 'Swimming with the school.' },
  { min: 251, max: 350, tier: 'rare', name: 'Rare', text: 'Below the thermocline. Nice.' },
  { min: 351, max: 449, tier: 'deepcut', name: 'Deep cut', text: 'Seriously deep dive.' },
  { min: 450, max: 700, tier: 'krillion', name: 'One in a krillion', text: 'Trench dweller. Absurd.' },
];

const ROUNDS = 7;
const ROUND_MS = 25000;
const PREVIEW_MS = 3000;
const EPOCH = '2026-07-16';

const MAX_ANSWER = 256;

/* Vertical position (0-100) of each tier in the seven-column dive log. */
const LOG_DEPTH = { plankton: 8, tooclever: 18, schooler: 36, rare: 60, deepcut: 82, krillion: 97 };

const POINTS_TO_TIER = { 10: 'plankton', 15: 'tooclever', 30: 'schooler', 60: 'rare', 85: 'deepcut', 100: 'krillion' };

const TIER_ALIASES = {
  plankton: 'plankton', krill: 'plankton',
  tooclever: 'tooclever', 'too clever': 'tooclever', 'too-clever': 'tooclever',
  schooler: 'schooler', school: 'schooler',
  rare: 'rare',
  deepcut: 'deepcut', 'deep cut': 'deepcut', 'deep-cut': 'deepcut',
  krillion: 'krillion', 'oneinakrillion': 'krillion', 'one in a krillion': 'krillion', 'one-in-a-krillion': 'krillion',
};

function tierKey(value) {
  if (!value) return null;
  const raw = String(value).trim().toLowerCase();
  if (TIERS[raw]) return raw;
  return TIER_ALIASES[raw] || TIER_ALIASES[raw.replace(/[^a-z]/g, '')] || null;
}

const bandFor = (score) => [...BANDS].reverse().find((b) => score >= b.min) || BANDS[0];

/* NFC accents dropped, & read as "and", everything but a-z0-9 removed. */
const normalize = (value) =>
  String(value)
    .normalize('NFKD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/&/g, 'and')
    .replace(/[^a-z0-9]/g, '');

/* Optimal string alignment distance: a swapped pair ("belguim") counts as one
   edit, which is the typo people actually make. */
function distance(a, b, limit = Infinity) {
  if (a === b) return 0;
  if (Math.abs(a.length - b.length) > limit) return limit + 1;
  const rows = [Array.from({ length: b.length + 1 }, (_, j) => j)];
  for (let i = 1; i <= a.length; i++) {
    const row = [i];
    let min = i;
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      let v = Math.min(rows[i - 1][j] + 1, row[j - 1] + 1, rows[i - 1][j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
        v = Math.min(v, rows[i - 2][j - 2] + 1);
      }
      row[j] = v;
      if (v < min) min = v;
    }
    if (min > limit) return limit + 1;
    rows.push(row);
  }
  return rows[a.length][b.length];
}

const ARTICLES = new Set(['a', 'an', 'the']);

const words = (value) => {
  const list = String(value).split(/[\s-]+/).map(normalize).filter(Boolean);
  return list.length > 1 && ARTICLES.has(list[0]) ? list.slice(1) : list;
};

/* Every reasonable spelling of a phrase: as written, without a leading
   article, and with simple singular/plural folds. */
function variants(value) {
  const out = new Set();
  const key = normalize(value);
  if (key) out.add(key);
  const list = words(value);
  if (list.length) out.add(list.join(''));
  for (const form of [...out]) {
    if (form.length > 3 && form.endsWith('ies')) out.add(`${form.slice(0, -3)}y`);
    if (form.length > 3 && form.endsWith('es')) out.add(form.slice(0, -2));
    if (form.length > 3 && form.endsWith('s')) out.add(form.slice(0, -1));
  }
  return [...out].filter(Boolean);
}

/* A multi-word typo must stay close word by word, so a different word that is a
   short edit away ("sea sponge" / "tea sponge") is never offered as a correction. */
function sameWords(input, word) {
  const a = words(input);
  const b = words(word);
  if (a.length < 2 && b.length < 2) return true;
  return a.length === b.length && a.every((w, i) => distance(w, b[i], 2) <= (w.length < 3 ? 0 : w.length < 8 ? 1 : 2));
}

const BASKET_ALIASES = {
  mashedpotatoes: ['mashed', 'mash'],
  frenchfries: ['fries'],
  bakedpotato: ['baked potato', 'jacket potato'],
};

/* Fuse is the second opinion: when edit distance finds nothing, it can still
   tell what a badly mangled single word was aiming at. */
const FUSE_THRESHOLD = 0.42;
const fuseIndex = new WeakMap();

function indexFor(answers) {
  let index = fuseIndex.get(answers);
  if (index) return index;
  const docs = [];
  for (const a of answers) {
    for (const word of [a.answer, ...(a.aliases || [])]) {
      if (word) docs.push({ word, a, text: String(word).toLowerCase() });
    }
  }
  index = new Fuse(docs, {
    includeScore: true,
    ignoreLocation: true,
    threshold: FUSE_THRESHOLD,
    minMatchCharLength: 3,
    keys: ['text'],
  });
  fuseIndex.set(answers, index);
  return index;
}

/* Fuse fallback: only for inputs long enough to be a word, and only when the
   shape agrees (word-by-word or the same words in another order). */
function fuseGuess(input, answers) {
  const key = normalize(input);
  if (key.length < 4) return null;

  /* Same words, another order ("rooney sally") — no edit distance needed. */
  const tokens = words(input);
  if (tokens.length > 1) {
    const fingerprint = [...tokens].sort().join(' ');
    const found = [];
    for (const a of answers) {
      for (const word of [a.answer, ...(a.aliases || [])]) {
        const other = words(word);
        if (other.length === tokens.length && [...other].sort().join(' ') === fingerprint && !found.includes(a)) found.push(a);
      }
    }
    if (found.length === 1) return { ...found[0], correction: true, fuzzy: true };
    if (found.length > 1) return null;
  }

  const hits = indexFor(answers)
    .search(String(input).toLowerCase(), { limit: 8 })
    .filter((hit) => hit.score <= FUSE_THRESHOLD)
    .filter((hit) => sameWords(input, hit.item.word));
  if (!hits.length) return null;
  const [best] = hits;
  const rival = hits.find((hit) => hit.item.a.answer !== best.item.a.answer && Math.abs(hit.score - best.score) < 0.05);
  if (rival) return null;
  return { ...best.item.a, correction: true, fuzzy: true };
}

/* Typing just the opening of a longer answer ("bosnia" for Bosnia and
   Herzegovina, "epony" for Ebony and Ivory). Only offer it when one answer
   fits, so a common first word never drags several answers with it. */
function partialGuess(input, answers) {
  const typed = words(input);
  const typedKey = normalize(input);
  if (!typed.length || typedKey.length < 4) return null;
  const found = [];
  for (const a of answers) {
    for (const word of [a.answer, ...(a.aliases || [])]) {
      const target = words(word);
      const targetKey = normalize(word);
      if (targetKey.length <= typedKey.length) continue;
      const fits = typed.length < target.length && typed.every((token, i) => {
        const allowance = token.length < 5 ? 1 : 2;
        return distance(token, target[i], allowance) <= allowance;
      });
      /* Also accept a half-typed word inside an answer or one of its aliases
         ("state hou" -> "state house bell"). */
      if ((fits || targetKey.startsWith(typedKey)) && !found.includes(a)) found.push(a);
    }
  }
  if (found.length !== 1) return null;
  return { ...found[0], correction: true, fuzzy: true };
}

/**
 * @param {string} input raw player text
 * @param {{answer:string, aliases?:string[], tier:string, note?:string}[]} answers
 * @returns {null | {answer:string, aliases:string[], tier:string, note:string, correction:boolean, fuzzy:boolean}}
 */
function matchAnswer(input, answers = []) {
  const key = normalize(input);
  if (!key || key.length > MAX_ANSWER) return null;
  const forms = new Set(variants(input));

  const entries = answers.flatMap((a) =>
    [a.answer, ...(a.aliases || []), ...(BASKET_ALIASES[normalize(a.answer)] || [])]
      .filter(Boolean)
      .map((word) => ({ word, a, keys: variants(word) }))
      .filter((e) => e.keys.length)
  );

  const exact = entries.find((e) => e.keys.some((k) => forms.has(k)));
  if (exact) {
    /* A short alias that is only the opening of the full answer ("bosnia")
       goes through the autofill step so the player sees the full name. */
    const typed = words(input);
    const target = words(exact.a.answer);
    const opens = target.length > typed.length && typed.every((token, i) => token === target[i]);
    return { ...exact.a, correction: opens || key !== normalize(exact.word), fuzzy: opens };
  }

  const allowance = key.length < 4 ? 0 : key.length < 8 ? 1 : 2;
  if (!allowance) return null;

  const candidates = [];
  for (const entry of entries) {
    if (!sameWords(input, entry.word)) continue;
    let best = Infinity;
    for (const form of forms) {
      for (const target of entry.keys) {
        const d = distance(form, target, allowance);
        if (d < best) best = d;
      }
    }
    if (best <= allowance) {
      candidates.push({ ...entry, d: best, lenDiff: Math.abs(key.length - normalize(entry.word).length) });
    }
  }
  if (!candidates.length) return partialGuess(input, answers) || fuseGuess(input, answers);

  candidates.sort((a, b) => a.d - b.d || a.lenDiff - b.lenDiff || TIERS[b.a.tier].score - TIERS[a.a.tier].score);
  const first = candidates[0];
  const rival = candidates.find((c) => c.d === first.d && c.lenDiff === first.lenDiff && c.a.answer !== first.a.answer);
  if (rival) return null;
  return { ...first.a, correction: true, fuzzy: true };
}

function shareText(day, results, url = '') {
  const score = results.reduce((sum, r) => sum + (r.score || 0), 0);
  const trail = results.map((r) => (r.tier && TIERS[r.tier] ? TIERS[r.tier].emoji : '⬛')).join('');
  const link = url ? `\n${url}` : '';
  return `Krillion #${day} 🦐\n${score}/700 · ${(score * 10).toLocaleString('en-US')}m\n${trail}${link}`;
}

function etDate(now = Date.now()) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(now));
}

/* Midnight America/New_York after the given YYYY-MM-DD. */
function resetAt(date) {
  const next = new Date(`${date}T12:00:00Z`);
  next.setUTCDate(next.getUTCDate() + 1);
  const day = next.toISOString().slice(0, 10);
  const probe = new Date(`${day}T04:00:00Z`);
  return etDate(probe) === day ? probe.getTime() : Date.parse(`${day}T05:00:00Z`);
}

function dayNumber(dateStr, epoch = EPOCH) {
  const a = Date.parse(`${epoch}T12:00:00Z`);
  const b = Date.parse(`${dateStr}T12:00:00Z`);
  if (!Number.isFinite(a) || !Number.isFinite(b)) return 1;
  return Math.round((b - a) / 86400000) + 1;
}

/* ---- src/dataset.mjs ---- */
/* Game data loading.

   Both modes read the public Krillion-Static CDN:
     daily/game_{day}.json
     unlimited/manifest.json, then unlimited/unlimited_{n}.json for every n.
   Every unlimited prompt is merged into one pool, and each dive deals seven
   random prompts from it without repeating a question.

   When the network is unavailable (or the CDN misses), the relative copies
   beside the page take over, then the packs inlined by build.mjs, so the page
   still works from a plain file: URL.

   Packs are deliberately tolerant: prompts|questions, text|prompt,
   tier-grouped answers, tier|rarity, points. */
const CDN_ROOT = 'https://cdn.jsdelivr.net/gh/Zotronix/Krillion-Static@main';

const asArray = (value) => (Array.isArray(value) ? value : []);

function normalizeAnswer(raw, groupTier) {
  if (typeof raw === 'string') {
    const answer = raw.trim();
    if (!answer) throw new Error('Empty answer in answer list.');
    return { answer, aliases: [], tier: groupTier || 'plankton', note: '' };
  }
  if (!raw || typeof raw !== 'object') throw new Error('Answer entries must be strings or objects.');
  const answer = String(raw.answer ?? raw.text ?? raw.value ?? raw.name ?? '').trim();
  if (!answer) throw new Error('Answer entry is missing its answer text.');
  const tier =
    tierKey(raw.tier ?? raw.rarity ?? raw.category ?? groupTier) ||
    POINTS_TO_TIER[Number(raw.points ?? raw.score)] ||
    'plankton';
  const aliases = asArray(raw.aliases ?? raw.accept ?? raw.alternatives)
    .map((a) => String(a).trim())
    .filter(Boolean);
  return { answer, aliases, tier, note: String(raw.note ?? raw.trivia ?? '').trim() };
}

function normalizeAnswers(raw) {
  if (Array.isArray(raw)) return raw.map((a) => normalizeAnswer(a));
  if (raw && typeof raw === 'object') {
    const out = [];
    for (const [group, list] of Object.entries(raw)) {
      const tier = tierKey(group) || POINTS_TO_TIER[Number(group)];
      if (!tier) {
        if (group === 'answers') out.push(...normalizeAnswers(list));
        continue;
      }
      for (const entry of asArray(list)) out.push(normalizeAnswer(entry, tier));
    }
    return out;
  }
  return [];
}

/** Validate a raw pack and return the canonical shape. Throws on unusable data. */
function normalizeGame(raw, { requireSeven = true } = {}) {
  if (!raw || typeof raw !== 'object') throw new Error('Pack is not a JSON object.');
  const list = asArray(raw.prompts).length ? raw.prompts : raw.questions;
  if (!Array.isArray(list)) throw new Error('Pack has no prompts array.');
  if (requireSeven && list.length < ROUNDS) throw new Error(`Pack needs ${ROUNDS} prompts, found ${list.length}.`);
  const prompts = (requireSeven ? list.slice(0, ROUNDS) : list).map((q, i) => {
    const text = String(q?.text ?? q?.prompt ?? q?.question ?? '').trim();
    if (!text) throw new Error(`Prompt ${i + 1} is missing its text.`);
    const answers = normalizeAnswers(q?.answers ?? q?.answerList ?? q?.options);
    if (!answers.length) throw new Error(`Prompt ${i + 1} has no answers.`);
    return { id: String(q?.id ?? `p${i + 1}`), text, answers };
  });
  if (requireSeven && prompts.length < ROUNDS) throw new Error(`Pack needs ${ROUNDS} usable prompts.`);
  return {
    dayNumber: Number.isFinite(raw.dayNumber) ? raw.dayNumber : null,
    gameId: raw.gameId != null ? Number(raw.gameId) : null,
    date: typeof raw.date === 'string' ? raw.date : null,
    source: typeof raw.source === 'string' ? raw.source : null,
    topic: typeof raw.topic === 'string' ? raw.topic : null,
    prompts,
  };
}

/* ---- remote paths ---- */

function dailyUrl(day) {
  return `${CDN_ROOT}/daily/game_${day}.json`;
}

function unlimitedManifestUrl() {
  return `${CDN_ROOT}/unlimited/manifest.json`;
}

function unlimitedUrl(id) {
  return `${CDN_ROOT}/unlimited/unlimited-${String(id).padStart(3, '0')}.json`;
}

/* Relative copies, used when the CDN cannot be reached. */
function dailyPath(day) {
  return `daily/game_${day}.json`;
}

function unlimitedPath(id) {
  return `unlimited/unlimited_${id}.json`;
}

function todayDay(now = Date.now()) {
  return dayNumber(etDate(now), EPOCH);
}

/* ---- inlined packs ---- */

function embedded(id) {
  if (typeof document === 'undefined') return null;
  const el = document.getElementById(id);
  if (!el) return null;
  try {
    return JSON.parse(el.textContent || 'null');
  } catch {
    return null;
  }
}

function offlineMode() {
  return typeof location !== 'undefined' && location.protocol === 'file:';
}

/* Deterministic PRNG so a dive number deals the same set on every device. */
function prng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

async function getJSON(url, { signal, cache = 'default' } = {}) {
  const res = await fetch(url, { cache, signal });
  if (!res.ok) throw new Error(`${url} returned ${res.status}`);
  return res.json();
}

/* null instead of throwing keeps the fallback chain readable; an abort still
   stops the chain so a cancelled load cannot resurrect stale data. */
async function tryPack(url, options) {
  try {
    return await getJSON(url, options);
  } catch (err) {
    if (options?.signal?.aborted) throw err;
    return null;
  }
}

/** Daily dive: the requested day's file, then yesterday's, then the bundle. */
async function loadDaily(day, { signal, previousFallback = false } = {}) {
  const ordered = [dailyUrl(day)];
  if (previousFallback && day > 1) ordered.push(dailyUrl(day - 1));
  ordered.push(dailyPath(day));

  for (const url of ordered) {
    const raw = await tryPack(url, { signal });
    if (!raw) continue;
    try {
      const game = normalizeGame(raw);
      const effective = game.dayNumber ?? day;
      return { ...game, dayNumber: effective, sample: false, offline: false, source: url };
    } catch (err) {
      if (signal?.aborted) throw err;
    }
  }

  const raw = embedded('pack-daily');
  if (!raw) throw new Error(`No daily pack for day ${day}.`);
  const game = normalizeGame(raw);
  return { ...game, dayNumber: day, sample: true, offline: offlineMode(), source: 'bundle' };
}

/* ---- unlimited pool ---- */

const MAX_POOL_FILES = 200;
const promptKey = (prompt) => normalize(prompt.text);

function uniquePrompts(prompts) {
  const seen = new Set();
  return prompts.filter((prompt) => {
    const key = promptKey(prompt);
    if (!key || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function packPrompts(raw) {
  return normalizeGame(raw, { requireSeven: false }).prompts;
}

async function remoteManifest({ signal } = {}) {
  for (const url of [unlimitedManifestUrl(), 'unlimited/manifest.json']) {
    const raw = await tryPack(url, { signal, cache: 'no-store' });
    const count = Math.floor(Number(raw?.count));
    if (Number.isFinite(count) && count > 0) return Math.min(MAX_POOL_FILES, count);
  }
  return null;
}

/** Every unlimited prompt in one pool, fetched once per page load. */
async function loadUnlimitedPool({ signal } = {}) {
  const count = await remoteManifest({ signal });
  if (!count) throw new Error('The unlimited manifest could not be loaded.');
  const ids = Array.from({ length: count }, (_, i) => i + 1);
  const packs = await Promise.all(ids.map((id) => tryPack(unlimitedUrl(id), { signal })));
  const prompts = uniquePrompts(
    packs.filter(Boolean).flatMap((pack) => {
      try {
        return packPrompts(pack);
      } catch {
        return [];
      }
    })
  );
  if (prompts.length < ROUNDS) throw new Error('The unlimited pool came back empty.');
  return prompts;
}

let poolPromise = null;

function sharedPool({ signal } = {}) {
  if (!poolPromise) {
    poolPromise = loadUnlimitedPool({ signal }).catch((err) => {
      poolPromise = null;
      throw err;
    });
  }
  return poolPromise;
}

function bundledPool() {
  const packs = [embedded('pack-unlimited'), embedded('pack-daily')].filter(Boolean);
  const prompts = uniquePrompts(
    packs.flatMap((raw) => {
      try {
        return packPrompts(raw);
      } catch {
        return [];
      }
    })
  );
  if (!prompts.length) throw new Error('No bundled prompts available.');
  return prompts;
}

/* Questions already asked this session, so a question does not come back until
   the whole pool has cycled. */
const servedThisSession = new Set();

function resetUnlimitedSession() {
  servedThisSession.clear();
  poolPromise = null;
}

function sample(list, count, rand) {
  const pool = list.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, count);
}

/** Deal seven distinct random prompts from the pool. */
function dealUnlimited(pool, id) {
  const list = uniquePrompts(pool);
  if (list.length < ROUNDS) throw new Error(`The unlimited pool needs ${ROUNDS} prompts, found ${list.length}.`);
  const fresh = list.filter((prompt) => !servedThisSession.has(promptKey(prompt)));
  const rand = prng(Math.imul((Number(id) || 1) >>> 0, 2654435761) + 7);
  let picks;
  if (fresh.length >= ROUNDS) {
    picks = sample(fresh, ROUNDS, rand);
  } else {
    /* The pool is nearly spent: take every unseen question, then start a new
       cycle with the oldest leftovers. */
    const used = list.filter((prompt) => servedThisSession.has(promptKey(prompt)));
    picks = [...sample(fresh, fresh.length, rand), ...sample(used, ROUNDS - fresh.length, rand)];
    servedThisSession.clear();
  }
  for (const prompt of picks) servedThisSession.add(promptKey(prompt));
  return { ...normalizeGame({ gameId: id, prompts: picks }), gameId: Number(id) || null };
}

async function loadUnlimited(id, { signal } = {}) {
  const wanted = Number.isFinite(Number(id)) && Number(id) > 0 ? Math.floor(Number(id)) : 1;
  let pool;
  let fallback = false;
  try {
    pool = await sharedPool({ signal });
  } catch (err) {
    if (signal?.aborted) throw err;
    pool = bundledPool();
    fallback = true;
  }
  const game = dealUnlimited(pool, wanted);
  return {
    ...game,
    gameId: wanted,
    sample: false,
    fallback,
    offline: fallback ? offlineMode() : false,
    source: fallback ? 'bundle' : 'cdn',
  };
}

async function loadManifest({ signal } = {}) {
  const count = await remoteManifest({ signal });
  if (count) return { count, offline: false };
  const bundle = embedded('pack-unlimited');
  const prompts = asArray(bundle?.prompts).length;
  return { count: prompts ? Math.max(1, Math.ceil(prompts / ROUNDS)) : 999, offline: true };
}

function pickUnlimitedId(manifest, played = new Set()) {
  const count = Math.max(1, Math.floor(Number(manifest?.count) || 1));
  const open = [];
  for (let i = 1; i <= count; i++) if (!played.has(i)) open.push(i);
  const pool = open.length ? open : Array.from({ length: count }, (_, i) => i + 1);
  return pool[Math.floor(Math.random() * pool.length)];
}

/* ---- src/engine.mjs ---- */
/* The dive state machine, with no DOM and no server: deadlines are local. */
class Dive {
  constructor({ prompts, settings = {}, now = () => Date.now() }) {
    this.prompts = prompts;
    this.settings = settings;
    this.now = now;
    this.index = 0;
    this.results = [];
    this.score = 0;
    this.phase = 'idle';
    this.previewUntil = 0;
    this.deadline = 0;
    this.pending = null;
    this.pausedAt = 0;
  }

  get prompt() {
    return this.prompts[this.index] || null;
  }

  get round() {
    return this.index + 1;
  }

  get band() {
    return bandFor(this.score);
  }

  start() {
    this.index = 0;
    this.results = [];
    this.score = 0;
    this.pending = null;
    this.phase = 'preview';
    this.previewUntil = this.now() + PREVIEW_MS;
    return this;
  }

  /** Called on every UI tick. Returns 'answer' the moment typing unlocks. */
  tick() {
    if (this.phase !== 'preview' || this.now() < this.previewUntil) return null;
    this.phase = 'answer';
    this.deadline = this.now() + ROUND_MS;
    return 'answer';
  }

  remaining() {
    if (this.phase !== 'answer') return 0;
    return Math.max(0, this.deadline - this.now());
  }

  expired() {
    return this.phase === 'answer' && this.now() >= this.deadline;
  }

  /**
   * @returns {{type:'empty'}|{type:'reject'}|{type:'correction', match:object}|{type:'result', result:object}}
   */
  submit(raw) {
    const text = String(raw ?? '').trim();
    if (!text) return { type: 'empty' };
    if (this.pending) {
      const pending = this.pending;
      this.pending = null;
      // The same typo again confirms it; an edit cancels it and scores afresh.
      if (normalize(text) === normalize(pending.raw)) {
        return { type: 'result', result: this.finish(pending, text, true) };
      }
    }
    const match = matchAnswer(text, this.prompt.answers);
    if (!match) return { type: 'reject' };
    if (match.fuzzy && this.settings.corrections !== false) {
      this.pending = { ...match, raw: text };
      return { type: 'correction', match };
    }
    return { type: 'result', result: this.finish(match, text, match.correction) };
  }

  acceptPending() {
    if (!this.pending) return null;
    const pending = this.pending;
    this.pending = null;
    return this.finish(pending, pending.answer, true);
  }

  clearPending() {
    this.pending = null;
  }

  finish(match, raw, corrected = false) {
    this.phase = 'landing';
    const tier = match?.tier || null;
    const points = tier ? TIERS[tier].score : 0;
    this.score += points;
    const result = {
      round: this.round,
      prompt: this.prompt.text,
      raw,
      answer: match?.answer || null,
      tier,
      score: points,
      corrected,
      note: match?.note || '',
    };
    this.results.push(result);
    return result;
  }

  advance() {
    if (this.phase !== 'landing') return this.phase;
    if (this.index + 1 >= Math.min(ROUNDS, this.prompts.length)) {
      this.phase = 'done';
      return this.phase;
    }
    this.index += 1;
    this.phase = 'preview';
    this.previewUntil = this.now() + PREVIEW_MS;
    this.pending = null;
    return this.phase;
  }

  pause() {
    if (!this.pausedAt && (this.phase === 'preview' || this.phase === 'answer' || this.phase === 'landing')) {
      this.pausedAt = this.now();
    }
  }

  resume() {
    if (!this.pausedAt) return;
    const gap = this.now() - this.pausedAt;
    this.pausedAt = 0;
    this.previewUntil += gap;
    this.deadline += gap;
  }
}

function store() {
  try {
    const probe = '__krillion_probe__';
    localStorage.setItem(probe, '1');
    localStorage.removeItem(probe);
    return localStorage;
  } catch {
    return null;
  }
}

function read(key, fallback) {
  const s = store();
  if (!s) return fallback;
  try {
    const raw = s.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}

function write(key, value) {
  const s = store();
  if (!s) return false;
  try {
    s.setItem(key, JSON.stringify(value));
    return true;
  } catch {
    return false;
  }
}

const getSettings = () => ({ ...DEFAULT_SETTINGS, ...read(SETTINGS_KEY, {}) });
const saveSettings = (settings) => write(SETTINGS_KEY, settings);

const getBuddy = () => read(BUDDY_KEY, 'krill');
const setBuddy = (id) => write(BUDDY_KEY, id);

const getHistory = () => {
  const list = read(HISTORY_KEY, []);
  return Array.isArray(list) ? list : [];
};

function clearHistory() {
  const s = store();
  if (!s) return;
  try {
    s.removeItem(HISTORY_KEY);
  } catch {
    /* storage blocked: nothing saved to clear */
  }
}

function addResult({ mode, key, score, results, at = Date.now() }) {
  const history = getHistory();
  const entry = { mode, key, score, at, results: results.map((r) => ({ prompt: r.prompt, answer: r.answer, raw: r.raw || '', tier: r.tier, score: r.score })) };
  const without = history.filter((h) => !(h.mode === mode && String(h.key) === String(key)));
  without.push(entry);
  write(HISTORY_KEY, without.slice(-120));
  return entry;
}

function findResult(mode, key) {
  return getHistory().find((h) => h.mode === mode && String(h.key) === String(key)) || null;
}

function playedUnlimited() {
  return new Set(getHistory().filter((h) => h.mode === 'unlimited').map((h) => Number(h.key)));
}

function stats(now = Date.now()) {
  const history = getHistory();
  const daily = history.filter((h) => h.mode === 'daily').sort((a, b) => a.at - b.at);
  const dates = [...new Set(daily.map((h) => etDate(h.at)))].sort();
  let bestStreak = 0;
  let run = 0;
  let previous = null;
  for (const date of dates) {
    if (previous) {
      const gap = Math.round((Date.parse(`${date}T12:00:00Z`) - Date.parse(`${previous}T12:00:00Z`)) / 86400000);
      run = gap === 1 ? run + 1 : 1;
    } else {
      run = 1;
    }
    bestStreak = Math.max(bestStreak, run);
    previous = date;
  }
  let current = 0;
  if (previous) {
    const today = etDate(now);
    const gap = Math.round((Date.parse(`${today}T12:00:00Z`) - Date.parse(`${previous}T12:00:00Z`)) / 86400000);
    current = gap <= 1 ? run : 0;
  }
  return {
    dives: daily.length,
    unlimited: history.length - daily.length,
    best: history.reduce((max, h) => Math.max(max, h.score || 0), 0),
    streak: current,
    bestStreak,
    latest: history.slice().sort((a, b) => b.at - a.at).slice(0, 5),
  };
}

function achievements(now = Date.now()) {
  const s = stats(now);
  const history = getHistory();
  const perfect = history.some((h) => h.score >= 700);
  const gold = history.some((h) => (h.results || []).some((r) => r.tier === 'krillion'));
  return [
    { id: 'first', name: 'First descent', text: 'Finish a daily dive.', got: s.dives >= 1, goal: 1, value: Math.min(1, s.dives) },
    { id: 'streak3', name: 'Three days under', text: 'Hold a 3-day daily streak.', got: s.bestStreak >= 3, goal: 3, value: Math.min(3, s.bestStreak) },
    { id: 'deep', name: 'Past 3,000 m', text: 'Score 300 in one dive.', got: history.some((h) => h.score >= 300), goal: 300, value: Math.min(300, s.best) },
    { id: 'gold', name: 'One in a Krillion', text: 'Land the gem answer.', got: gold, goal: 1, value: gold ? 1 : 0 },
    { id: 'perfect', name: 'Trench floor', text: 'Score a perfect 700.', got: perfect, goal: 700, value: Math.min(700, s.best) },
    { id: 'dives10', name: 'Ten dives', text: 'Finish ten dives of any mode.', got: history.length >= 10, goal: 10, value: Math.min(10, history.length) },
  ];

function iconSrc(tier) {
  const key = tierKey(tier);
  return key ? ICON_SRC[key] : '';
}

function tierImage(tier) {
  const src = iconSrc(tier);
  return src ? `<img src="${src}" alt="" width="24" height="24">` : '';
}

function diveChart(results) {
  const rows = [0, 25, 50, 75, 100]
    .map((n) => `<div class="chart-grid" style="top:${n}%"><span>${n === 0 ? '0m' : `−${n}`}</span></div>`)
    .join('');
  const columns = results
    .map((r, i) => {
      const tier = tierKey(r.tier);
      const drop = tier ? LOG_DEPTH[tier] : 3;
      return `<div class="dive-column" title="Round ${i + 1}: ${r.answer || 'miss'}, ${r.score} points" style="--drop:${drop}%;--delay:${i * 90}ms">
        <div class="dive-stem"></div>
        <div class="dive-dot">${tierImage(tier)}</div>
        <small>${i + 1}</small>
      </div>`;
    })
    .join('');
  return `<div class="dive-chart" role="img" aria-label="Seven answer scores, zero at the surface and one hundred at the deepest point">${rows}<div class="dive-columns">${columns}</div></div>`;
}

/* No population data exists offline, so the axis is honest about it. */
function distributionChart(score) {
  const width = 560;
  const top = 18;
  const x = (score / 700) * width;
  const ticks = Array.from({ length: 8 }, (_, i) => `<path d="M${i * 80} 140v6" stroke="#7d93b855"/><text x="${i * 80}" y="161" text-anchor="middle" fill="#7d93b8" font-size="12">${i * 100}</text>`).join('');
  return `<svg viewBox="0 0 560 174" role="img" aria-label="Your score on a zero to 700 axis. Population comparison is not available offline.">
    <path d="M0 140H560" stroke="#7d93b855"/>
    ${ticks}
    <path d="M${x} 140V${top + 40}" stroke="#ff5d8f" stroke-width="2"/>
    <circle cx="${x}" cy="${top + 40}" r="4" fill="#ff5d8f"/>
    <text x="${Math.max(12, Math.min(548, x))}" y="173" text-anchor="middle" fill="#ff5d8f" font-size="12" letter-spacing="2">YOU</text>
  </svg>`;
}

/* The review lists a readable sample, never a whole 1,000-answer pack. The
   five scored tiers follow the game's rarity mix; krillion is a rare extra.
   Missing tiers give their slots back to the tiers that do have answers. */
const REVIEW_SPLIT = [
  ['plankton', 0.12],
  ['tooclever', 0.06],
  ['schooler', 0.30],
  ['rare', 0.20],
  ['deepcut', 0.25],
];
const REVIEW_SHOWN_MAX = 80;
const byRarity = (a, b) => (TIERS[tierKey(b.tier)]?.score || 0) - (TIERS[tierKey(a.tier)]?.score || 0);

function randomTake(list, count) {
  const copy = list.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, count);
}

function reviewSample(answers, mine = '') {
  const total = answers.length;
  if (total <= 80) return { list: [...answers].sort(byRarity), total };

  const buckets = new Map(REVIEW_SPLIT.map(([key]) => [key, []]));
  buckets.set('krillion', []);
  for (const answer of answers) {
    const key = tierKey(answer.tier) || 'plankton';
    buckets.get(key).push(answer);
  }

  const target = 60 + Math.floor(Math.random() * 21);
  const krillion = buckets.get('krillion');
  const krillionCount = Math.min(krillion.length, 1 + Math.floor(Math.random() * 3));
  const budget = Math.max(0, target - krillionCount);
  const quotas = {};
  let picked = 0;
  for (const [key, share] of REVIEW_SPLIT) {
    quotas[key] = Math.min(buckets.get(key).length, Math.floor(budget * share));
    picked += quotas[key];
  }
  while (picked < budget) {
    const open = REVIEW_SPLIT.filter(([key]) => quotas[key] < buckets.get(key).length);
    if (!open.length) break;
    const weight = open.reduce((sum, [, share]) => sum + share, 0);
    let roll = Math.random() * weight;
    let chosen = open[open.length - 1][0];
    for (const [key, share] of open) {
      roll -= share;
      if (roll <= 0) { chosen = key; break; }
    }
    quotas[chosen]++;
    picked++;
  }

  const list = [];
  for (const [key] of REVIEW_SPLIT) list.push(...randomTake(buckets.get(key), quotas[key]));
  list.push(...randomTake(krillion, krillionCount));
  if (mine && !list.some((a) => normalize(a.answer) === mine)) {
    const entry = answers.find((a) => normalize(a.answer) === mine);
    if (entry) list.push(entry);
  }
  /* Picking your answer can push a full sample one over; drop another row
     rather than the one you made. */
  while (list.length > REVIEW_SHOWN_MAX) {
    const drop = list.findIndex((a) => normalize(a.answer) !== mine);
    if (drop < 0) break;
    list.splice(drop, 1);
  }
  return { list: list.sort(byRarity), total };
}

function bandList(current) {
  return `<ul class="band-list">${BANDS.map((b) => `
    <li class="${b === current ? 'current' : ''}">
      ${tierImage(b.tier)}
      <span class="band-range" style="color:${TIERS[b.tier].color}">${b.min}${b.min === 450 ? '+' : `–${b.max}`}</span>
      <span>${b.name}. ${b.text}</span>
    </li>`).join('')}</ul>`;
}
