name: Update Static Krillion JSON

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Generate latest.json and daily/game_N.json
        run: python scripts/fetch_krillion.py

      - name: Commit JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add latest.json daily/
          git diff --staged --quiet || git commit -m "Update Krillion game JSON"
          git push
      - name: Purge JSDelivr
        run: |
          sleep 15
          curl -s "https://purge.jsdelivr.net/gh/Zotronix/Krillion-Static@main/latest.json"
