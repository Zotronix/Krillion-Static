name: Fetch Daily Krillion Questions

on:
  schedule:
    # Runs every day at 06:15 UTC (1:15 AM EST / 2:15 AM EDT)
    - cron: "15 6 * * *"
  workflow_dispatch: # Allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Krillion scraper
        run: python scripts/fetch_krillion.py

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update Krillion daily questions ($(date -u +'%Y-%m-%d'))"
          git push
