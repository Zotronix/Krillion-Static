name: Generate Daily Trivia Puzzle

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  # Allows you to trigger it manually from the Actions tab for testing
  workflow_dispatch:

permissions:
  contents: write # Required so the Action can push commits back to the repo

jobs:
  build-puzzle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate daily JSON file
        env:
          # Store your API key in Repo Settings -> Secrets and variables -> Actions
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-daily.js

      - name: Commit and push new puzzle
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Add daily puzzle for $(date -u +'%Y-%m-%d')" && git push)
